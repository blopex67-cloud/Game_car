              \ Vector3) -> bool:\n\tvar v: Dictionary = cfg[\"vision\"]\n\tvar d: float = to_player.length()\n\tif d > float(v[\"range\"]):\n\t\treturn false\n\tvar fwd: Vector3 = -global_transform.basis.z\n\tvar\
