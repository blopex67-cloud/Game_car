              \t\tt.global_position = global_position + Vector3(0, 1.3, 0)\n\t\tarm_targets[side] = t\n\t\tpairs.append({\"chain\": cfg[\"skeleton\"][\"arms\"][side], \"target\": t})\n\t# SkeletonIK3D: una cadena\
