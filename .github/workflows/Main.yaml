name: Compilar APK Volumi3D (Godot)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_STATUS: "stable"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar herramientas de Android
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Descargar Godot y export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL -o "$RUNNER_TEMP/godot/godot.zip" "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q -o "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fL -o "$RUNNER_TEMP/godot/templates.tpz" "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TPL_DIR"
          unzip -q -o "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/tpl"
          mv "$RUNNER_TEMP"/godot/tpl/templates/* "$TPL_DIR/"

      - name: Crear proyecto Godot (si no existe)
        run: |
          set -e
          mkdir -p scenes

          if [ ! -f project.godot ]; then
          cat > project.godot <<'PROJ'
          ; Engine configuration file.
          config_version=5

          [application]

          config/name="Volumi3D"
          run/main_scene="res://scenes/main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")

          [display]

          window/handheld/orientation=0

          [input_devices]

          pointing/emulate_mouse_from_touch=false
          pointing/emulate_touch_from_mouse=false

          [rendering]

          renderer/rendering_method="mobile"
          PROJ
          fi

          if [ ! -f scenes/main.tscn ]; then
          cat > scenes/main.tscn <<'TSCN'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/main.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          TSCN
          fi

          if [ ! -f export_presets.cfg ]; then
          cat > export_presets.cfg <<'PRESETS'
          [preset.0]

          name="Android Debug"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Volumi3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          screen/immersive_mode=true
          package/unique_name="com.volumi3d.app"
          package/name="Volumi3D"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          version/code=1
          version/name="1.0.1"
          PRESETS
          fi

          if [ ! -f .gitignore ]; then
          printf '.godot/\nbuild/\n*.apk\n' > .gitignore
          fi

      - name: Configurar keystore y SDK para Godot
        run: |
          set -e
          KEY="$HOME/debug.keystore"
          keytool -genkeypair -keystore "$KEY" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEY"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Importar proyecto y exportar APK
        run: |
          set -e
          if [ ! -f scripts/main.gd ]; then
            echo "ERROR: falta scripts/main.gd en el repositorio. Súbelo a la carpeta scripts/ y vuelve a lanzar el workflow."
            exit 1
          fi

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android

          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg

          "$GODOT_BIN" --headless --path . --import
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android Debug" build/Volumi3D.apk
          test -f build/Volumi3D.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Volumi3D-APK
          path: build/Volumi3D.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Volumi3D build ${{ github.run_number }}
          files: build/Volumi3D.apk
          make_latest: true
