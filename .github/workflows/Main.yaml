              \ or heard\n\nfunc _walk_to_waypoint(delta: float, speed: float) -> void:\n\tif waypoints.is_empty():\n\t\treturn\n\tvar wp: Array = waypoints[wp_index]\n\tvar goal := Vector3(float(wp[0]), 0.0, float(wp[2]))\n\
              \tvar dir: Vector3 = goal - global_position\n\tdir.y = 0.0\n\tif dir.length() < 0.5:\n\t\twp_index = (wp_index + 1) % waypoints.size()\n\t\t_set_state(\"idle\")\n\t\treturn\n\t_face(dir, delta)\n\t\
