              if lm != null:
                  var bb = lm.global_transform * lm.get_aabb()
                  line_center = bb.get_center()
                  line_half = maxf(bb.size.x, bb.size.z) * 0.5 + 4.0
              else:
                  line_center = spawn_xf.origin + fwd0 * 12.0
                  line_half = 12.0


          # ================= MENÚ Y MODOS =================
          func go_menu():
              state = State.MENU
              _remove_ais()
              _clear_mods()
              countdown = -1.0
              _reset_player()
              car.input_locked = true
              hud.active = false
              hud.visible = false
              hud.results = []
              hud.msg = ""
              hud.banner = ""
              menu.visible = true
              menu.queue_redraw()


          func _on_menu_choice(i):
              menu.visible = false
              hud.visible = true
              hud.active = true
              hud.results = []
              hud.banner = ""
              surprise = (i == 2)
              if i == 0:
                  _start_free()
              else:
                  _start_competition()


          func _start_free():
              state = State.FREE
              _remove_ais()
              _clear_mods()
              _reset_lap()
              _reset_player()
              car.input_locked = false
              hud.msg = ""


          func _start_competition():
              _remove_ais()
              _clear_mods()
              _reset_lap()
              _reset_player()
              car.input_locked = false
              hud.msg = ""
              if trace_ready:
                  _start_grid()
              else:
                  state = State.RECON
                  hud.banner = "VUELTA DE RECONOCIMIENTO: traza el circuito"


          func _start_grid():
              state = State.GRID
              _remove_ais()
              for k in range(AI_COUNT):
                  racers.append(_make_ai(k))
              if surprise:
                  _apply_mod(MODS[randi() % MODS.size()])
              else:
                  _clear_mods()
              finish_count = 0
              race_time = 0.0
              _place_racer(racers[0], AI_COUNT)
              for k in range(AI_COUNT):
                  _place_racer(racers[k + 1], k)
              countdown = 3.5
              hud.msg = ""
              hud.banner = ("SORPRESA: " + mod_name) if surprise else "COMPETENCIA"
              hud.results = []


          func _make_ai(k):
              var c = CarScript.new()
              c.build(car_scene, false)
              add_child(c)
              c.configure(k + 1, true)
              var r = RacerScript.new()
              r.car = c
              r.name_str = AI_NAMES[k]
              r.lane = AI_LANES[k]
              r.skill = randf_range(0.9, 1.04)
              return r


          func _remove_ais():
              for r in racers:
                  if not r.is_player and is_instance_valid(r.car):
                      r.car.queue_free()
              racers = [player_r]


          # Coloca un corredor en parrilla, detrás de la línea de meta (slot 0 = más adelante)
          func _place_racer(r, slot):
              var n = trace.size()
              var i = posmod(n - 8 * (slot + 1), n)
              var t = _flat(trace[(i + 1) % n] - trace[i])
              var pos = trace[i] + t.cross(Vector3.UP) * r.lane + Vector3(0.0, 0.3, 0.0)
              var xf = Transform3D(Basis.looking_at(t, Vector3.UP), pos)
              r.car.set_spawn(xf)
              r.car.global_transform = xf
              r.car.linear_velocity = Vector3.ZERO
              r.car.angular_velocity = Vector3.ZERO
              r.car.gear = 1
              r.car.input_locked = true
              r.idx = i
              r.laps = 0
              r.done = false
              r.rank = 0
              r.finish_time = -1.0
              r.stuck_t = 0.0
              if r.is_player:
                  have_prev = false


          func _grid_logic(delta):
              countdown -= delta
              if countdown > 2.5:
                  hud.msg = "3"
              elif countdown > 1.5:
                  hud.msg = "2"
              elif countdown > 0.5:
                  hud.msg = "1"
              elif countdown > -0.8:
                  hud.msg = "GO!"
              else:
                  hud.msg = ""
              for r in racers:
                  r.car.input_locked = countdown > 0.5
              if countdown <= -0.8:
                  state = State.RACE


          # ================= MODS SORPRESA =================
          func _clear_mods():
              mod_name = ""
              env.fog_density = DEF_FOG_DENSITY
              env.fog_light_color = DEF_FOG
              env.ambient_light_energy = DEF_AMBIENT
              sun.light_energy = DEF_SUN
              sky_mat.sky_top_color = SKY_TOP
              sky_mat.sky_horizon_color = SKY_HOR
              for r in racers:
                  if is_instance_valid(r.car):
                      r.car.power_mult = 1.0
                      r.car.gravity_scale = 1.0


          func _apply_mod(m):
              _clear_mods()
              mod_name = m
              for r in racers:
                  if m == "TURBO":
                      r.car.power_mult = 1.6
                  elif m == "GRAVEDAD LUNAR":
                      r.car.gravity_scale = 0.4
                  elif m == "COLORES LOCOS":
                      r.car.set_paint(randi() % CarScript.PAINTS.size())
              if m == "NIEBLA DENSA":
                  env.fog_density = 0.012
              elif m == "NOCHE":
                  sun.light_energy = 0.2
                  env.ambient_light_energy = 0.4
                  sky_mat.sky_top_color = Color(0.01, 0.02, 0.06)
                  sky_mat.sky_horizon_color = Color(0.05, 0.07, 0.12)


          # ================= ESTADO DE CARRERA =================
          func _reset_lap():
              started = false
              armed = false
              lap = 0
              lap_time = 0.0
              last_lap = -1.0
              best_lap = -1.0
              recording = false
              have_prev = false


          func _reset_player():
              car.set_spawn(spawn_xf)
              car.global_transform = spawn_xf
              car.linear_velocity = Vector3.ZERO
              car.angular_velocity = Vector3.ZERO
              car.gear = 1
              have_prev = false


          func _physics_process(delta):
              if car == null or state == State.MENU:
                  return
              _lap_logic(delta)
              if state == State.RECON:
                  if trace_ready:
                      _start_grid()
                  return
              if state == State.FREE:
                  return
              if state == State.GRID:
                  _grid_logic(delta)
              elif state == State.RACE:
                  race_time += delta
              _update_racers(delta)


          func _update_racers(delta):
              for r in racers:
                  r.track_progress(trace)
                  if not r.done and r.laps >= RACE_LAPS and state != State.GRID:
                      _finish(r)
                  if not r.is_player:
                      r.drive(delta, trace, r.done)


          func _finish(r):
              finish_count += 1
              r.done = true
              r.rank = finish_count
              r.finish_time = race_time
              if r.is_player:
                  state = State.FINISHED
                  hud.msg = "¡FIN!"


          # Orden de carrera: primero los que han terminado, luego por distancia recorrida
          func _key(r):
              if r.done:
                  return 1.0e9 - float(r.rank)
              return float(r.laps * trace.size() + maxi(r.idx, 0))


          func _ranked():
              var arr = racers.duplicate()
              arr.sort_custom(func(a, b): return _key(a) > _key(b))
              return arr


          func _result_lines():
              var out = []
              var arr = _ranked()
              for i in range(arr.size()):
                  var r = arr[i]
                  var nm = "TÚ" if r.is_player else r.name_str
                  var tail = hud._fmt(r.finish_time) if r.done else "en pista"
                  out.append("%d. %s   %s" % [i + 1, nm, tail])
              return out


          # Cronometraje por línea de meta (vuelta libre y reconocimiento)
          func _lap_logic(delta):
              var cp = car.global_position
              if not have_prev:
                  prev_pos = cp
                  have_prev = true
              var d_prev = (prev_pos - line_center).dot(fwd0)
              var d_cur = (cp - line_center).dot(fwd0)
              var side = absf((cp - line_center).dot(fwd0.cross(Vector3.UP)))
              var dist = Vector2(cp.x - line_center.x, cp.z - line_center.z).length()

              if started:
                  lap_time += delta
                  if dist > 140.0:
                      armed = true

              if recording and car.all_road and cp.distance_to(rec_last) > TRACE_STEP:
                  trace.append(cp)
                  rec_last = cp

              if d_prev < 0.0 and d_cur >= 0.0 and side < line_half and car.fwd_speed > 0.0:
                  if not started:
                      started = true
                      lap = 1
                      lap_time = 0.0
                      if not trace_ready:
                          recording = true
                          trace.clear()
                          trace.append(cp)
                          rec_last = cp
                  elif armed:
                      last_lap = lap_time
                      if best_lap < 0.0 or last_lap < best_lap:
                          best_lap = last_lap
                      hud.toast = "VUELTA " + str(lap) + "  " + hud._fmt(last_lap)
                      toast_t = 3.5
                      lap += 1
                      lap_time = 0.0
                      armed = false
                      if recording:
                          trace_ready = trace.size() > 50
                          recording = not trace_ready
                          if recording:
                              trace.clear()
                              trace.append(cp)
                              rec_last = cp
              prev_pos = cp

              if toast_t > 0.0:
                  toast_t -= delta
                  if toast_t <= 0.0:
                      hud.toast = ""


          # ================= IA: ver _ranked / drive en ai_driver.gd =================
          func _flat(v):
              var f = Vector3(v.x, 0.0, v.z)
              if f.length() < 0.001:
                  return Vector3(0.0, 0.0, -1.0)
              return f.normalized()


          func respawn():
              car.respawn()
              have_prev = false


          func cycle_camera():
              cam_mode = (cam_mode + 1) % 3
              orbit_yaw = 0.0
              orbit_pitch = 0.0


          # Llamado desde el HUD al arrastrar fuera de los botones
          func orbit_by(rel: Vector2):
              orbit_yaw -= rel.x * 0.008
              orbit_pitch = clampf(orbit_pitch - rel.y * 0.004, -0.1, 0.8)
              orbit_idle = 0.0


          func _update_hud():
              hud.lap = lap
              hud.lap_time = lap_time
              hud.last_lap = last_lap
              hud.best_lap = best_lap
              if state == State.FREE or state == State.RECON or state == State.MENU:
                  hud.race_mode = false
                  hud.results = []
                  return
              hud.race_mode = true
              hud.race_pos = _ranked().find(player_r) + 1
              hud.race_total = racers.size()
              hud.race_lap = mini(player_r.laps + 1, RACE_LAPS)
              hud.race_laps = RACE_LAPS
              hud.results = _result_lines() if state == State.FINISHED else []


          func _process(delta):
              if car == null or camera == null:
                  return
              if state == State.MENU:
                  # modo demo: la cámara da vueltas al coche detrás del menú
                  attract_yaw += delta * 0.2
                  var c = car.global_position
                  var off = Vector3(sin(attract_yaw), 0.0, cos(attract_yaw)) * 11.0
                  camera.global_position = c + off + Vector3(0.0, 4.0, 0.0)
                  camera.look_at(c + Vector3(0.0, 1.0, 0.0), Vector3.UP)
                  camera.fov = 55.0
                  return
              _update_hud()
              _update_camera(delta)


          func _update_camera(delta):
              var cb = car.global_transform
              var fwd = -cb.basis.z
              fwd.y = 0.0
              if fwd.length() < 0.05:
                  fwd = cam_dir
              fwd = fwd.normalized()
              var vel = car.linear_velocity
              vel.y = 0.0
              var tdir = fwd
              if vel.length() > 8.0 and car.fwd_speed > 0.0:
                  tdir = (fwd * 0.55 + vel.normalized() * 0.45).normalized()
              cam_dir = cam_dir + (tdir - cam_dir) * clampf(delta * 5.0, 0.0, 1.0)
              if cam_dir.length() < 0.01:
                  cam_dir = fwd
              cam_dir = cam_dir.normalized()

              # tras soltar la cámara, vuelve suavemente detrás del coche
              orbit_idle += delta
              if orbit_idle > ORBIT_RETURN:
                  var k = clampf(delta * 2.5, 0.0, 1.0)
                  orbit_yaw = lerpf(orbit_yaw, 0.0, k)
                  orbit_pitch = lerpf(orbit_pitch, 0.0, k)

              var base_fov = 68.0
              if cam_mode == 2:
                  camera.global_transform = cb * Transform3D(Basis(Vector3.UP, orbit_yaw), Vector3(0.0, 1.12, -0.2))
                  base_fov = 78.0
              else:
                  var dist = 6.0
                  var h = 1.9
                  if cam_mode == 1:
                      dist = 9.0
                      h = 3.2
                  var off = cam_dir.rotated(Vector3.UP, orbit_yaw)
                  var p = cb.origin - off * dist
                  var ty = cb.origin.y + h + orbit_pitch * dist * 0.8
                  cam_y = lerpf(cam_y, ty, clampf(delta * 6.0, 0.0, 1.0))
                  p.y = cam_y
                  camera.global_position = p
                  camera.look_at(cb.origin + Vector3(0.0, 0.9, 0.0) + cam_dir * 2.0, Vector3.UP)
              var tf = base_fov + clampf(car.speed_kmh / 250.0, 0.0, 1.0) * 20.0
              camera.fov = lerpf(camera.fov, tf, clampf(delta * 3.0, 0.0, 1.0))
          EOF

      - name: Instalar Godot 4.3 y plantillas de exportacion
        run: |
          set -e
          GV=4.3-stable
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GV/Godot_v${GV}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GV/Godot_v${GV}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GV}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Configurar Android SDK y firma debug
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmd.zip -d cmdtmp
            mv cmdtmp/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Importar recursos (modelos y texturas)
        run: |
          cd game
          godot --headless --import || true
          godot --headless --import || true
          ls -la models

      - name: Revisar scripts (falla si hay errores de sintaxis)
        run: |
          fail=0
          for s in car ai_driver menu hud main; do
            echo "== $s.gd =="
            out=$(godot --headless --path game --check-only --script "res://$s.gd" 2>&1) || true
            echo "$out"
            if echo "$out" | grep -qE "Parse Error|Compile Error|Failed to load script"; then
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Hay errores en los scripts, revisa el log de arriba"
            exit 1
          fi

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/SubaruRacing.apk"
          ls -la build
          test -f build/SubaruRacing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SubaruRacing-APK
          path: build/SubaruRacing.apk
