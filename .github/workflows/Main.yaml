name: Amyr - Pasillo Oscuro (generar y compilar APK)

# UN SOLO ARCHIVO: este YAML contiene el juego completo (game.yaml, scripts y herramientas).
# Pasos:
#   1. Sube assets/models/Amyr.fbx al repositorio (es binario, no puede ir en YAML).
#   2. Sube este archivo a .github/workflows/build-apk.yml
#   3. Actions -> Amyr - Pasillo Oscuro -> Run workflow. Descarga el APK del artefacto.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar y mover modelo FBX
        run: |
          mkdir -p assets/models
          if [ ! -f assets/models/Amyr.fbx ]; then
            FOUND=$(find . -iname "*amyr*.fbx" -not -path "./.git/*" | head -n 1)
            if [ -z "$FOUND" ]; then
              FOUND=$(find . -iname "*.fbx" -not -path "./.git/*" | head -n 1)
            fi
            if [ -z "$FOUND" ]; then
              echo "::error::No hay ningún archivo .fbx en el repositorio. Sube Amyr.fbx a main."
              exit 1
            fi
            cp "$FOUND" assets/models/Amyr.fbx
            echo "Modelo encontrado en: $FOUND"
          fi

      - name: Escribir el juego desde este YAML
        run: |
          mkdir -p "$(dirname game.yaml)"
          cat > game.yaml << 'AMYR_GAME_YAML_EOF'
          meta:
            name: Amyr - Pasillo Oscuro
            engine: Godot 4.3
            orientation: landscape
            note: Todo el juego está en este archivo. Los binarios (FBX, WAV, JPG) quedan en assets/.
          game:
            title: Amyr - Pasillo Oscuro
            version: 0.1.0
            package: com.tuestudio.amyrhorror
            orientation: landscape
            target_sdk: 34
            min_sdk: 24
          graphics:
            renderer: forward_plus
            msaa: 2x
            shadow_resolution: 2048
            ssao: true
            ssr: false
            glow: true
            fog:
              enabled: true
              density: 0.035
              color: '#0a0d0c'
            exposure: 1.1
            target_fps: 60
          player:
            name: Guardia nocturno
            view: first_person
            eye_height: 1.65
            walk_speed: 2.2
            run_speed: 4.0
            look_sensitivity: 0.12
            touch_controls:
              move_stick: left
              look_area: right
              buttons:
              - flashlight
              - run
            flashlight:
              enabled: true
              battery_seconds: 120
              intensity: 6.0
              range: 22.0
              angle_deg: 28
              color: '#fff4d6'
              flicker_when_low: true
              sounds:
                true: flashlight_click
                false: flashlight_click
                hum: flashlight_hum_loop
            stamina:
              max: 100
              drain_per_second: 18
              regen_per_second: 12
            health:
              max: 100
              hit_damage: 100
          camera:
            near: 0.05
            far: 120.0
            fov: 72
            head_bob: true
            bob_amount: 0.035
          game_over:
            jumpscare_sound: jumpscare_stinger
            screen_fade_seconds: 1.2
            retry_delay_seconds: 3.0
          model:
            file: assets/models/Amyr.fbx
            scale: 1.0
            reference_texture: assets/textures/amyr_reference.jpg
            height_meters: 1.9
          skeleton:
            root: Hips
            head: Head
            neck: Neck
            spine:
            - Spine
            - Spine1
            legs:
              left:
                root: LeftUpLeg
                middle: LeftLeg
                end: LeftFoot
              right:
                root: RightUpLeg
                middle: RightLeg
                end: RightFoot
            arms:
              left:
                root: LeftArm
                middle: LeftForeArm
                end: LeftHand
              right:
                root: RightArm
                middle: RightForeArm
                end: RightHand
          ik_legs:
            enabled: true
            step_length: 0.75
            step_height: 0.18
            step_duration: 0.42
            run_step_duration: 0.24
            foot_raycast_length: 2.0
            hip_bob: 0.05
            idle_sway: 0.01
          ik_arms:
            enabled: true
            idle_pose: relaxed
            attack_reach: 1.1
          states:
            idle:
              description: Quieto, mirando al vacío. No te ve.
              animation: idle
              ik_legs: planted
              sounds:
                loop: ambience_hallway_loop
                random:
                - amyr_servo_creak
                random_interval:
                - 6
                - 14
              transitions:
              - to: wander
                after_seconds:
                - 8
                - 15
              - to: hunt
                when: player_seen
            wander:
              description: Camina por el escenario sin saber dónde estás.
              animation: walk
              speed: 1.2
              ik_legs: stepping
              sounds:
                step: amyr_leg_step
                random:
                - amyr_servo_creak
              transitions:
              - to: idle
                when: reached_waypoint
              - to: hunt
                when: player_seen
            hunt:
              description: Te ha visto. Corre hacia ti.
              animation: run
              speed: 3.4
              ik_legs: stepping_fast
              sounds:
                loop: amyr_growl
                step: amyr_leg_step
              transitions:
              - to: attack
                when: distance_lt
                distance: 1.6
              - to: search
                when: lost_sight_for_seconds
                seconds: 6
            search:
              description: Pierde tu rastro y mira alrededor.
              animation: idle
              speed: 0.6
              sounds:
                random:
                - amyr_servo_creak
                - distant_clang
              transitions:
              - to: hunt
                when: player_seen
              - to: wander
                after_seconds:
                - 10
                - 18
            attack:
              description: 'Ataque estilo FNAF: se queda quieto, se congela y se lanza.'
              animation: attack
              freeze_seconds: 0.8
              ik_arms: attack_reach
              sounds:
                on_enter: amyr_attack_screech
              on_hit: game_over
              transitions:
              - to: wander
                when: missed
          vision:
            fov_deg: 110
            range: 18
            requires_light: true
            flashlight_detect_range: 14
            hearing_radius: 5
            memory_seconds: 6
          audio:
            bus:
              master: 1.0
              music: 0.6
              sfx: 1.0
              ambience: 0.5
              enemy: 1.0
            sounds:
              footstep_1:
                file: assets/audio/footstep_1.wav
                bus: sfx
                volume_db: -6
                pitch_var: 0.08
              footstep_2:
                file: assets/audio/footstep_2.wav
                bus: sfx
                volume_db: -6
                pitch_var: 0.08
              footstep_3:
                file: assets/audio/footstep_3.wav
                bus: sfx
                volume_db: -6
                pitch_var: 0.08
              flashlight_click:
                file: assets/audio/flashlight_click.wav
                bus: sfx
                volume_db: -3
              flashlight_hum_loop:
                file: assets/audio/flashlight_hum_loop.wav
                bus: sfx
                volume_db: -18
                loop: true
              ambience_hallway_loop:
                file: assets/audio/ambience_hallway_loop.wav
                bus: ambience
                volume_db: -10
                loop: true
              heartbeat_loop:
                file: assets/audio/heartbeat_loop.wav
                bus: music
                volume_db: -4
                loop: true
                trigger: player.health < 50 or enemy.state == hunt
              breathing_scared:
                file: assets/audio/breathing_scared.wav
                bus: music
                volume_db: -8
                trigger: enemy.state == hunt
              amyr_servo_creak:
                file: assets/audio/amyr_servo_creak.wav
                bus: enemy
                volume_db: -12
                spatial: true
                max_distance: 20
              amyr_growl:
                file: assets/audio/amyr_growl.wav
                bus: enemy
                volume_db: -4
                spatial: true
                loop: true
                max_distance: 30
              amyr_leg_step:
                file: assets/audio/amyr_leg_step.wav
                bus: enemy
                volume_db: -6
                spatial: true
                max_distance: 25
              amyr_attack_screech:
                file: assets/audio/amyr_attack_screech.wav
                bus: enemy
                volume_db: 0
                spatial: true
                max_distance: 40
              jumpscare_stinger:
                file: assets/audio/jumpscare_stinger.wav
                bus: master
                volume_db: 2
              distant_clang:
                file: assets/audio/distant_clang.wav
                bus: enemy
                volume_db: -10
                spatial: true
                max_distance: 35
          scenario:
            id: test_hallway
            name: Pasillo de prueba
            size_meters:
            - 40
            - 30
            ceiling_height: 3.0
            floor_material: tiles_dirty
            wall_material: wallpaper_old
            lights:
            - id: ceiling_1
              pos:
              - 0
              - 2.8
              - -4
              color: '#ffe2a8'
              energy: 1.2
              flicker: true
            - id: ceiling_2
              pos:
              - 0
              - 2.8
              - 4
              color: '#ffe2a8'
              energy: 0.4
              flicker: true
              flicker_freq: 9
            - id: exit_sign
              pos:
              - -14
              - 2.6
              - 0
              color: '#ff2a2a'
              energy: 0.8
              flicker: false
            spawn:
              player:
                pos:
                - 0
                - 1.65
                - 10
                facing_deg: 180
              amyr:
                pos:
                - 0
                - 0
                - -12
                facing_deg: 0
                start_state: idle
            waypoints:
            - - -8
              - 0
              - -10
            - - 8
              - 0
              - -10
            - - 8
              - 0
              - 0
            - - -8
              - 0
              - 0
            - - -8
              - 0
              - 8
            - - 8
              - 0
              - 8
            walls:
            - from:
              - -10
              - 0
              - -15
              to:
              - 10
              - 0
              - -15
            - from:
              - -10
              - 0
              - 15
              to:
              - 10
              - 0
              - 15
            - from:
              - -10
              - 0
              - -15
              to:
              - -10
              - 0
              - 15
            - from:
              - 10
              - 0
              - -15
              to:
              - 10
              - 0
              - 15
            - from:
              - -3
              - 0
              - -2
              to:
              - -3
              - 0
              - 4
              thickness: 0.2
            - from:
              - 3
              - 0
              - -6
              to:
              - 3
              - 0
              - -1
              thickness: 0.2
            props:
            - type: arcade_cabinet
              pos:
              - -9
              - 0
              - -13
              rot_deg: 90
            - type: metal_pipe
              pos:
              - 9.2
              - 0
              - -14
            - type: crate
              pos:
              - -4
              - 0
              - 10
            - type: tv_static
              pos:
              - 0
              - 0.6
              - -14.5
            exit:
              pos:
              - -14
              - 1.0
              - 0
              win_message: Escapaste.
            checkpoints:
            - pos:
              - 0
              - 0
              - 10
              id: start
            - pos:
              - 0
              - 0
              - -4
              id: middle
            debug:
              show_ik_targets: true
              show_vision_cone: true
              show_waypoints: true
              god_mode: false
          files:
            project.godot: '; Godot 4.3 - Amyr: Pasillo Oscuro

              config_version=5


              [application]

              config/name="Amyr - Pasillo Oscuro"

              config/version="0.1.0"

              run/main_scene="res://scenes/main.tscn"

              config/features=PackedStringArray("4.3", "Forward Plus")


              [display]

              window/size/viewport_width=1920

              window/size/viewport_height=1080

              window/handheld/orientation=0

              window/stretch/mode="canvas_items"


              [rendering]

              renderer/rendering_method="forward_plus"

              anti_aliasing/quality/msaa_3d=1

              environment/ssao/enabled=true

              lights_and_shadows/directional_shadow/size=2048

              '
            scenes/main.tscn: '[gd_scene load_steps=2 format=3]


              [ext_resource type="Script" path="res://scripts/main.gd" id="1"]


              [node name="Main" type="Node3D"]

              script = ExtResource("1")

              '
            export_presets.cfg: '[preset.0]


              name="Android"

              platform="Android"

              runnable=true

              dedicated_server=false

              custom_features=""

              export_filter="all_resources"

              include_filter=""

              exclude_filter=""

              export_path="build/AmyrPasillo.apk"

              encryption_include_filters=""

              encryption_exclude_filters=""

              encrypt_pck=false

              encrypt_directory=false


              [preset.0.options]


              custom_template/debug=""

              custom_template/release=""

              gradle_build/use_gradle_build=false

              gradle_build/export_format=0

              architectures/armeabi-v7a=false

              architectures/arm64-v8a=true

              architectures/x86=false

              architectures/x86_64=false

              version/code=1

              version/name="0.1.0"

              package/unique_name="com.tuestudio.amyrhorror"

              package/name="Amyr - Pasillo Oscuro"

              package/signed=true

              screen/orientation=0

              screen/immersive_mode=true

              permissions/vibrate=true

              permissions/internet=false

              '
          scripts:
            scripts/main.gd: "extends Node3D\n## Arranca el juego: carga los JSON, construye el escenario y gestiona el fin de partida.\n\nconst DATA_GAME := \"res://data/game.json\"\nconst DATA_SCENE := \"res://data/test_scenario.json\"\
              \n\nvar game_cfg: Dictionary\nvar scene_cfg: Dictionary\nvar player\nvar amyr\nvar audio\nvar lights_flicker: Array = []\nvar game_over_layer: ColorRect\nvar is_over := false\n\nfunc _ready() -> void:\n\
              \tDisplayServer.screen_set_orientation(DisplayServer.SCREEN_LANDSCAPE)\n\tgame_cfg = _load_json(DATA_GAME)\n\tscene_cfg = _load_json(DATA_SCENE)\n\t_setup_environment()\n\t_build_scenario(scene_cfg[\"\
              scenario\"])\n\taudio = preload(\"res://scripts/audio_manager.gd\").new()\n\tadd_child(audio)\n\tplayer = preload(\"res://scripts/player.gd\").new()\n\tplayer.setup(game_cfg, scene_cfg[\"scenario\"\
              ][\"spawn\"][\"player\"], audio)\n\tadd_child(player)\n\tamyr = preload(\"res://scripts/amyr.gd\").new()\n\tamyr.setup(scene_cfg[\"scenario\"], audio, player, self)\n\tadd_child(amyr)\n\t_setup_game_over_overlay()\n\
              \taudio.play_loop(\"ambience_hallway_loop\")\n\nfunc _load_json(path: String) -> Dictionary:\n\tvar f := FileAccess.open(path, FileAccess.READ)\n\treturn JSON.parse_string(f.get_as_text())\n\nfunc _setup_environment()\
              \ -> void:\n\tvar g: Dictionary = game_cfg[\"graphics\"]\n\tvar env := Environment.new()\n\tenv.background_mode = Environment.BG_COLOR\n\tenv.background_color = Color.BLACK\n\tenv.ambient_light_source\
              \ = Environment.AMBIENT_SOURCE_COLOR\n\tenv.ambient_light_color = Color(0.05, 0.06, 0.06)\n\tenv.tonemap_mode = Environment.TONE_MAPPER_FILMIC\n\tenv.tonemap_exposure = float(g[\"exposure\"])\n\tenv.ssao_enabled\
              \ = bool(g[\"ssao\"])\n\tenv.glow_enabled = bool(g[\"glow\"])\n\tenv.fog_enabled = bool(g[\"fog\"][\"enabled\"])\n\tenv.fog_density = float(g[\"fog\"][\"density\"])\n\tenv.fog_light_color = Color(g[\"\
              fog\"][\"color\"])\n\tvar we := WorldEnvironment.new()\n\twe.environment = env\n\tadd_child(we)\n\nfunc _build_scenario(s: Dictionary) -> void:\n\tvar size: Array = s[\"size_meters\"]\n\tvar h: float\
              \ = float(s[\"ceiling_height\"])\n\t# Suelo y techo\n\t_add_box(Vector3(0, -0.05, 0), Vector3(size[0], 0.1, size[1]), Color(0.18, 0.17, 0.15), true)\n\t_add_box(Vector3(0, h + 0.05, 0), Vector3(size[0],\
              \ 0.1, size[1]), Color(0.12, 0.12, 0.12), true)\n\t# Muros perimetrales y divisiones\n\tfor w in s[\"walls\"]:\n\t\t_add_wall(w)\n\t# Luces\n\tfor l in s[\"lights\"]:\n\t\tvar light := OmniLight3D.new()\n\
              \t\tlight.position = Vector3(l[\"pos\"][0], l[\"pos\"][1], l[\"pos\"][2])\n\t\tlight.light_color = Color(l[\"color\"])\n\t\tlight.light_energy = float(l[\"energy\"])\n\t\tlight.omni_range = 9.0\n\t\t\
              light.shadow_enabled = true\n\t\tadd_child(light)\n\t\tif l.get(\"flicker\", false):\n\t\t\tlights_flicker.append({\"node\": light, \"base\": float(l[\"energy\"]), \"freq\": float(l.get(\"flicker_freq\"\
              , 3.0))})\n\t# Puntos de salida y utilería simple\n\tfor p in s[\"props\"]:\n\t\t_add_box(Vector3(p[\"pos\"][0], 0.5, p[\"pos\"][2]), Vector3(0.9, 1.0, 0.6), Color(0.25, 0.22, 0.2), true)\n\nfunc _add_wall(w:\
              \ Dictionary) -> void:\n\tvar a: Array = w[\"from\"]; var b: Array = w[\"to\"]\n\tvar t: float = float(w.get(\"thickness\", 0.3))\n\tvar start := Vector3(a[0], 0, a[2]); var end := Vector3(b[0], 0,\
              \ b[2])\n\tvar length := start.distance_to(end)\n\tvar mid := (start + end) / 2.0\n\tvar box := Vector3(length if abs(end.x - start.x) > 0.01 else t, 3.0, length if abs(end.z - start.z) > 0.01 else\
              \ t)\n\t_add_box(Vector3(mid.x, 1.5, mid.z), box, Color(0.42, 0.40, 0.34), true)\n\nfunc _add_box(pos: Vector3, size: Vector3, color: Color, collide: bool) -> void:\n\tvar mi := MeshInstance3D.new()\n\
              \tvar mesh := BoxMesh.new()\n\tmesh.size = size\n\tmi.mesh = mesh\n\tvar mat := StandardMaterial3D.new()\n\tmat.albedo_color = color\n\tmat.roughness = 0.9\n\tmi.material_override = mat\n\tmi.position\
              \ = pos\n\tif collide:\n\t\tvar body := StaticBody3D.new()\n\t\tvar cs := CollisionShape3D.new()\n\t\tvar shape := BoxShape3D.new()\n\t\tshape.size = size\n\t\tcs.shape = shape\n\t\tbody.add_child(cs)\n\
              \t\tbody.add_child(mi)\n\t\tadd_child(body)\n\telse:\n\t\tadd_child(mi)\n\nfunc _process(delta: float) -> void:\n\tvar t := Time.get_ticks_msec() / 1000.0\n\tfor f in lights_flicker:\n\t\tvar n: float\
              \ = sin(t * f[\"freq\"]) * sin(t * f[\"freq\"] * 0.37 + 1.3)\n\t\tf[\"node\"].light_energy = f[\"base\"] * (0.6 + 0.4 * (1.0 if n > -0.3 else 0.1))\n\nfunc trigger_game_over() -> void:\n\tif is_over:\n\
              \t\treturn\n\tis_over = true\n\taudio.play_once(\"jumpscare_stinger\")\n\tgame_over_layer.visible = true\n\tvar tween := create_tween()\n\ttween.tween_property(game_over_layer, \"modulate:a\", 1.0,\
              \ float(game_cfg[\"game_over\"][\"screen_fade_seconds\"]))\n\ttween.tween_interval(float(game_cfg[\"game_over\"][\"retry_delay_seconds\"]))\n\ttween.tween_callback(func(): get_tree().reload_current_scene())\n\
              \nfunc _setup_game_over_overlay() -> void:\n\tvar layer := CanvasLayer.new()\n\tgame_over_layer = ColorRect.new()\n\tgame_over_layer.color = Color.BLACK\n\tgame_over_layer.set_anchors_preset(Control.PRESET_FULL_RECT)\n\
              \tgame_over_layer.modulate.a = 0.0\n\tgame_over_layer.visible = false\n\tvar label := Label.new()\n\tlabel.text = \"AMYR TE ENCONTRÓ\"\n\tlabel.set_anchors_preset(Control.PRESET_CENTER)\n\tlabel.add_theme_font_size_override(\"\
              font_size\", 48)\n\tgame_over_layer.add_child(label)\n\tlayer.add_child(game_over_layer)\n\tadd_child(layer)\n"
            scripts/player.gd: "extends CharacterBody3D\n## Jugador en primera persona con linterna. Controles: joystick táctil (izquierda),\n## arrastrar a la derecha para mirar. En PC: WASD, ratón, Shift correr,\
              \ F linterna.\n\nvar cfg: Dictionary\nvar audio\nvar camera: Camera3D\nvar flashlight: SpotLight3D\nvar battery: float\nvar stamina: float\nvar health: float\nvar flashlight_on := true\nvar yaw := 0.0\n\
              var pitch := 0.0\nvar move_touch := -1\nvar look_touch := -1\nvar move_vec := Vector2.ZERO\nvar bob_t := 0.0\nvar step_timer := 0.0\nvar bob_amount := 0.035\nvar sound_radius := 0.0   # cuánto ruido\
              \ haces (Amyr te oye si corres cerca)\n\nfunc setup(game_cfg: Dictionary, spawn: Dictionary, audio_mgr: Node) -> void:\n\tcfg = game_cfg[\"player\"]\n\taudio = audio_mgr\n\tposition = Vector3(spawn[\"\
              pos\"][0], 0.0, spawn[\"pos\"][2])\n\tyaw = deg_to_rad(float(spawn[\"facing_deg\"]))\n\tbattery = float(cfg[\"flashlight\"][\"battery_seconds\"])\n\tstamina = float(cfg[\"stamina\"][\"max\"])\n\thealth\
              \ = float(cfg[\"health\"][\"max\"])\n\tvar cam_cfg: Dictionary = game_cfg[\"camera\"]\n\tvar shape := CapsuleShape3D.new()\n\tshape.radius = 0.35; shape.height = 1.8\n\tvar cs := CollisionShape3D.new();\
              \ cs.shape = shape; cs.position.y = 0.9\n\tadd_child(cs)\n\tbob_amount = float(cam_cfg[\"bob_amount\"])\n\tcamera = Camera3D.new()\n\tcamera.position.y = float(cfg[\"eye_height\"])\n\tcamera.near =\
              \ float(cam_cfg[\"near\"]); camera.far = float(cam_cfg[\"far\"])\n\tcamera.fov = float(cam_cfg[\"fov\"])\n\tadd_child(camera)\n\tflashlight = SpotLight3D.new()\n\tvar fl: Dictionary = cfg[\"flashlight\"\
              ]\n\tflashlight.light_energy = float(fl[\"intensity\"])\n\tflashlight.spot_range = float(fl[\"range\"])\n\tflashlight.spot_angle = float(fl[\"angle_deg\"])\n\tflashlight.light_color = Color(fl[\"color\"\
              ])\n\tflashlight.shadow_enabled = true\n\tcamera.add_child(flashlight)\n\taudio.play_loop(fl[\"sounds\"][\"hum\"])\n\nfunc _ready() -> void:\n\tcamera.make_current()\n\nfunc _input(event: InputEvent)\
              \ -> void:\n\t# Pantalla táctil: mitad izquierda = mover, mitad derecha = mirar\n\tif event is InputEventScreenTouch:\n\t\tvar half := get_viewport().get_visible_rect().size.x / 2.0\n\t\tif event.pressed:\n\
              \t\t\tif event.position.x < half and move_touch == -1:\n\t\t\t\tmove_touch = event.index\n\t\t\telif event.position.x >= half and look_touch == -1:\n\t\t\t\tlook_touch = event.index\n\t\t\telse:\n\t\
              \t\t\t_toggle_flashlight()\n\t\telse:\n\t\t\tif event.index == move_touch: move_touch = -1; move_vec = Vector2.ZERO\n\t\t\tif event.index == look_touch: look_touch = -1\n\telif event is InputEventScreenDrag:\n\
              \t\tif event.index == move_touch:\n\t\t\tmove_vec = (event.position - _touch_origin_center()).normalized()\n\t\telif event.index == look_touch:\n\t\t\t_apply_look(event.relative)\n\telif event is InputEventMouseMotion\
              \ and Input.mouse_mode == Input.MOUSE_MODE_CAPTURED:\n\t\t_apply_look(event.relative)\n\telif event is InputEventKey and event.pressed and event.keycode == KEY_F:\n\t\t_toggle_flashlight()\n\telif event\
              \ is InputEventMouseButton and event.pressed:\n\t\tInput.mouse_mode = Input.MOUSE_MODE_CAPTURED\n\nfunc _touch_origin_center() -> Vector2:\n\tvar s := get_viewport().get_visible_rect().size\n\treturn\
              \ Vector2(s.x * 0.2, s.y * 0.75)\n\nfunc _apply_look(rel: Vector2) -> void:\n\tvar sens := float(cfg[\"look_sensitivity\"]) * 0.02\n\tyaw -= rel.x * sens\n\tpitch = clamp(pitch - rel.y * sens, deg_to_rad(-80),\
              \ deg_to_rad(80))\n\nfunc _toggle_flashlight() -> void:\n\tif battery <= 0.0:\n\t\treturn\n\tflashlight_on = not flashlight_on\n\tflashlight.visible = flashlight_on\n\taudio.play_once(cfg[\"flashlight\"\
              ][\"sounds\"][\"on\"])\n\nfunc _physics_process(delta: float) -> void:\n\trotation.y = yaw\n\tcamera.rotation.x = pitch\n\n\tvar input := Vector2.ZERO\n\tif move_touch != -1:\n\t\tinput = move_vec\n\
              \telse:\n\t\tinput = Input.get_vector(\"ui_left\", \"ui_right\", \"ui_up\", \"ui_down\")\n\tvar running := Input.is_key_pressed(KEY_SHIFT) and stamina > 0.0 and input.length() > 0.1\n\tvar speed :=\
              \ float(cfg[\"run_speed\"]) if running else float(cfg[\"walk_speed\"])\n\tvar dir := (transform.basis * Vector3(input.x, 0, input.y)).normalized()\n\tvelocity.x = dir.x * speed\n\tvelocity.z = dir.z\
