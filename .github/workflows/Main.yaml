name: UV Studio - Generar y compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generar proyecto UV Studio
        run: |
          set -e
          mkdir -p src .github/workflows

          cat > package.json <<'EOF'
          {
            "name": "uv-studio",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/filesystem": "^6.0.1",
              "@capacitor/share": "^6.0.3",
              "jszip": "^3.10.1",
              "three": "^0.160.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "vite": "^5.4.0"
            }
          }
          EOF

          cat > vite.config.js <<'EOF'
          export default {
            base: './',
            build: {
              outDir: 'dist',
              chunkSizeWarningLimit: 2000
            }
          };
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tuestudio.uvstudio",
            "appName": "UV Studio",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "backgroundColor": "#070a12"
            }
          }
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          android/app/build/
          android/.gradle/
          *.apk
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
            <meta name="color-scheme" content="dark" />
            <title>UV Studio</title>
          </head>
          <body>
            <div class="app">
              <header class="hud-top">
                <div class="brand">UV<span>STUDIO</span></div>
                <div class="actions">
                  <label class="btn ghost" for="fileIn">Abrir</label>
                  <input id="fileIn" type="file" accept=".glb,.gltf" hidden />
                  <button class="btn ghost" id="btnUnwrap">Auto-UV</button>
                  <button class="btn primary" id="btnGLB">GLB</button>
                  <button class="btn primary" id="btnZIP">ZIP</button>
                </div>
              </header>

              <section class="viewport hud-frame" id="viewport">
                <canvas id="view3d"></canvas>
                <div class="hud-info" id="info">—</div>
              </section>

              <nav class="tabs">
                <button data-tab="albedo" class="active">Color</button>
                <button data-tab="height">Altura</button>
                <button data-tab="rough">Rugosidad</button>
                <button data-tab="normal">Normal</button>
                <button data-tab="uv">UV</button>
              </nav>

              <section class="editor hud-frame">
                <div class="editor-head"><span id="editorTitle">Color (albedo)</span></div>
                <div class="canvas-wrap" id="canvasWrap"></div>

                <div class="toolbar">
                  <div class="row" data-show="albedo height rough">
                    <button class="chip" data-tool="brush">Pincel</button>
                    <button class="chip" data-tool="eraser">Borrador</button>
                    <button class="chip" id="btnFill">Relleno</button>
                    <button class="chip" id="btnUndo">Deshacer</button>
                    <button class="chip" id="btnClear">Limpiar</button>
                  </div>
                  <div class="row" data-show="albedo height rough">
                    <label>Tamaño <input type="range" id="size" min="1" max="200" value="24" /></label>
                    <label>Opacidad <input type="range" id="opacity" min="5" max="100" value="100" /></label>
                  </div>
                  <div class="row" data-show="albedo">
                    <label>Color <input type="color" id="color" value="#8b5cf6" /></label>
                  </div>
                  <div class="row" data-show="height rough">
                    <label>Valor <input type="range" id="gray" min="0" max="255" value="128" /></label>
                    <button class="chip" id="btnNoise">Ruido</button>
                  </div>
                  <div class="row" data-show="normal">
                    <label>Fuerza <input type="range" id="strength" min="0.5" max="12" step="0.1" value="4" /></label>
                    <button class="chip" id="btnBake">Recalcular</button>
                  </div>
                  <div class="row" data-show="uv">
                    <button class="chip" id="btnUVRefresh">Actualizar vista UV</button>
                  </div>
                </div>
              </section>
            </div>

            <div class="toast" id="toast"></div>
            <script type="module" src="/src/main.js"></script>
          </body>
          </html>
          EOF

          cat > src/style.css <<'EOF'
          :root {
            --bg: #070a12;
            --panel: rgba(14, 20, 36, 0.78);
            --line: rgba(0, 229, 255, 0.28);
            --cyan: #00e5ff;
            --violet: #8b5cf6;
            --text: #e6f1ff;
            --muted: #7a8ba8;
          }

          * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
          [hidden] { display: none !important; }

          html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
          }

          .app {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
          }

          /* ---------- Header ---------- */
          .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
          }
          .brand { font-weight: 800; letter-spacing: 2px; font-size: 18px; }
          .brand span { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 229, 255, 0.6); }
          .actions { display: flex; gap: 6px; }

          .btn {
            font: inherit; font-size: 12px; font-weight: 600;
            padding: 8px 10px; border-radius: 10px;
            border: 1px solid var(--line); background: rgba(0, 229, 255, 0.06);
            color: var(--text); cursor: pointer; text-align: center;
            transition: transform 0.08s, background 0.2s;
          }
          .btn:active { transform: scale(0.96); }
          .btn.primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); border: none; color: #04101a; }
          .btn.ghost { background: transparent; }

          /* ---------- HUD frames ---------- */
          .hud-frame {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.08) inset;
          }
          .hud-frame::before {
            content: "";
            position: absolute; inset: 5px;
            border: 1px solid rgba(0, 229, 255, 0.10);
            border-radius: 10px;
            pointer-events: none;
          }

          /* ---------- Viewport 3D ---------- */
          .viewport {
            flex: 0 0 38vh;
            margin: 0 10px;
          }
          .viewport canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            touch-action: none;
          }
          .hud-info {
            position: absolute; left: 12px; top: 10px;
            font: 11px ui-monospace, Menlo, monospace;
            color: var(--cyan);
            pointer-events: none;
            z-index: 2;
          }

          /* ---------- Tabs ---------- */
          .tabs {
            display: flex; gap: 6px;
            margin: 8px 10px 0;
          }
          .tabs button {
            flex: 1;
            font: inherit; font-size: 12px; font-weight: 600;
            padding: 9px 0; border-radius: 10px;
            border: 1px solid var(--line); background: transparent;
            color: var(--muted); cursor: pointer;
          }
          .tabs button.active {
            color: #04101a;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border-color: transparent;
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
          }

          /* ---------- Editor ---------- */
          .editor {
            flex: 1; min-height: 0;
            margin: 8px 10px 10px;
            padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
          }
          .editor-head {
            font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
            color: var(--cyan);
          }
          .canvas-wrap {
            flex: 1; min-height: 0;
            display: flex; align-items: center; justify-content: center;
            position: relative;
          }
          .canvas-wrap canvas {
            display: none;
            width: min(100%, 46vh);
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            background: #0b1020;
            touch-action: none;
            box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.2);
          }
          .canvas-wrap canvas.show { display: block; }

          /* ---------- Toolbar ---------- */
          .toolbar { display: flex; flex-direction: column; gap: 6px; }
          .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
          .row label {
            flex: 1; min-width: 150px;
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--muted);
          }
          input[type="range"] { flex: 1; accent-color: var(--cyan); }
          input[type="color"] {
            width: 44px; height: 30px; border: none; background: none; cursor: pointer;
          }
          .chip {
            font: inherit; font-size: 12px; font-weight: 600;
            padding: 7px 11px; border-radius: 999px;
            border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03);
            color: var(--text); cursor: pointer;
          }
          .chip.on {
            background: rgba(0, 229, 255, 0.18);
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
            color: var(--cyan);
          }

          /* ---------- Toast ---------- */
          .toast {
            position: fixed; left: 50%; bottom: 22px;
            transform: translate(-50%, 20px);
            opacity: 0; transition: 0.25s ease;
            padding: 10px 16px; border-radius: 12px;
            background: rgba(10, 16, 30, 0.95);
            border: 1px solid var(--line);
            color: var(--cyan); font-size: 13px;
            pointer-events: none; z-index: 10;
            max-width: 90vw; text-align: center;
          }
          .toast.show { opacity: 1; transform: translate(-50%, 0); }
          EOF

          cat > src/main.js <<'EOF'
          import './style.css';
          import * as THREE from 'three';
          import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
          import { GLTFExporter } from 'three/examples/jsm/exporters/GLTFExporter.js';
          import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
          import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
          import JSZip from 'jszip';
          import { Capacitor } from '@capacitor/core';
          import { Filesystem, Directory } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';

          const S = 1024;
          const $ = (id) => document.getElementById(id);
          const clamp = (v) => Math.max(0, Math.min(255, v));
          const grayHex = (v) => { const h = v.toString(16).padStart(2, '0'); return `#${h}${h}${h}`; };

          // ---------- UI ----------
          let toastTimer;
          function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
          }

          const on = (id, ev, fn) => $(id).addEventListener(ev, async (e) => {
            try { await fn(e); }
            catch (err) { console.error(err); toast('Error: ' + (err.message || err)); }
          });

          // ---------- Estado ----------
          const brush = {
            tool: 'brush',
            size: 24,
            opacity: 1,
            color: '#8b5cf6',
            gray: 128,
            normalStrength: 4
          };
          const dirty = { albedo: false, rough: false, normal: false };
          const TITLES = {
            albedo: 'Color (albedo)',
            height: 'Altura → genera normal',
            rough: 'Rugosidad (blanco = rugoso)',
            normal: 'Normal (generado)',
            uv: 'Layout UV'
          };
          let model = null;
          let modelName = 'demo_caja';
          let currentTab = 'albedo';

          // ---------- Canvas de mapas ----------
          function makeCanvas(fill, key) {
            const c = document.createElement('canvas');
            c.width = c.height = S;
            c.dataset.key = key;
            const ctx = c.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = fill;
            ctx.fillRect(0, 0, S, S);
            return c;
          }
          const canvases = {
            albedo: makeCanvas('#d9d9d9', 'albedo'),
            height: makeCanvas('#808080', 'height'),
            rough: makeCanvas('#808080', 'rough'),
            normal: makeCanvas('#8080ff', 'normal'),
            uv: makeCanvas('#05080f', 'uv')
          };
          for (const c of Object.values(canvases)) $('canvasWrap').appendChild(c);

          // ---------- Pintor ----------
          class Painter {
            constructor(canvas, key, base) {
              this.canvas = canvas;
              this.key = key;
              this.base = base;
              this.ctx = canvas.getContext('2d', { willReadFrequently: true });
              this.history = [];
              this.drawing = false;
              this.last = null;
              this.onStroke = null;

              canvas.addEventListener('pointerdown', (e) => this.down(e));
              canvas.addEventListener('pointermove', (e) => this.move(e));
              canvas.addEventListener('pointerup', () => this.up());
              canvas.addEventListener('pointercancel', () => this.up());
            }

            color() {
              if (brush.tool === 'eraser') return this.base;
              return this.key === 'albedo' ? brush.color : grayHex(brush.gray);
            }

            pos(e) {
              const r = this.canvas.getBoundingClientRect();
              return {
                x: (e.clientX - r.left) * (S / r.width),
                y: (e.clientY - r.top) * (S / r.height)
              };
            }

            style() {
              const c = this.ctx;
              const col = this.color();
              c.globalAlpha = brush.opacity;
              c.strokeStyle = col;
              c.fillStyle = col;
              c.lineWidth = brush.size;
              c.lineCap = 'round';
              c.lineJoin = 'round';
            }

            changed() { dirty[this.key] = true; }

            snapshot() {
              this.history.push(this.ctx.getImageData(0, 0, S, S));
              if (this.history.length > 12) this.history.shift();
            }

            undo() {
              const img = this.history.pop();
              if (!img) return toast('Nada que deshacer');
              this.ctx.putImageData(img, 0, 0);
              this.changed();
              this.onStroke?.(this.key);
            }

            fill(color) {
              this.snapshot();
              this.ctx.fillStyle = color;
              this.ctx.fillRect(0, 0, S, S);
              this.changed();
              this.onStroke?.(this.key);
            }

            clear() { this.fill(this.base); }

            noise(amount) {
              this.snapshot();
              const img = this.ctx.getImageData(0, 0, S, S);
              const d = img.data;
              for (let i = 0; i < d.length; i += 4) {
                const n = (Math.random() - 0.5) * amount * 2;
                d[i] = clamp(d[i] + n);
                d[i + 1] = clamp(d[i + 1] + n);
                d[i + 2] = clamp(d[i + 2] + n);
              }
              this.ctx.putImageData(img, 0, 0);
              this.changed();
              this.onStroke?.(this.key);
            }

            down(e) {
              if (e.button > 0) return;
              this.snapshot();
              this.drawing = true;
              this.canvas.setPointerCapture(e.pointerId);
              this.last = this.pos(e);
              this.style();
              this.ctx.beginPath();
              this.ctx.arc(this.last.x, this.last.y, brush.size / 2, 0, Math.PI * 2);
              this.ctx.fill();
              this.ctx.globalAlpha = 1;
              this.changed();
            }

            move(e) {
              if (!this.drawing) return;
              const p = this.pos(e);
              this.style();
              this.ctx.beginPath();
              this.ctx.moveTo(this.last.x, this.last.y);
              this.ctx.lineTo(p.x, p.y);
              this.ctx.stroke();
              this.ctx.globalAlpha = 1;
              this.last = p;
              this.changed();
            }

            up() {
              if (!this.drawing) return;
              this.drawing = false;
              this.last = null;
              this.onStroke?.(this.key);
            }
          }

          const painters = {
            albedo: new Painter(canvases.albedo, 'albedo', '#d9d9d9'),
            height: new Painter(canvases.height, 'height', '#808080'),
            rough: new Painter(canvases.rough, 'rough', '#808080')
          };

          // ---------- Three.js ----------
          const viewport = $('viewport');
          const renderer = new THREE.WebGLRenderer({ canvas: $('view3d'), antialias: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x070a12);
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

          const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
          camera.position.set(2.5, 1.8, 3.2);

          const controls = new OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;

          const grid = new THREE.GridHelper(10, 20, 0x00e5ff, 0x12324a);
          grid.material.transparent = true;
          grid.material.opacity = 0.35;
          scene.add(grid);

          const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
          keyLight.position.set(3, 5, 4);
          scene.add(keyLight);
          const rim = new THREE.PointLight(0x00e5ff, 2, 0, 2);
          rim.position.set(-3, 2, -3);
          scene.add(rim);

          const modelGroup = new THREE.Group();
          scene.add(modelGroup);

          const textures = {
            albedo: new THREE.CanvasTexture(canvases.albedo),
            rough: new THREE.CanvasTexture(canvases.rough),
            normal: new THREE.CanvasTexture(canvases.normal)
          };
          textures.albedo.colorSpace = THREE.SRGBColorSpace;
          const maxAniso = renderer.capabilities.getMaxAnisotropy();
          Object.values(textures).forEach((t) => (t.anisotropy = maxAniso));

          const material = new THREE.MeshStandardMaterial({
            map: textures.albedo,
            roughnessMap: textures.rough,
            roughness: 1,
            normalMap: textures.normal,
            normalScale: new THREE.Vector2(1, 1),
            metalness: 0
          });

          // ---------- UV ----------
          function ensureUV(mesh, force = false) {
            if (mesh.geometry.attributes.uv && !force) return;

            const g = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry.clone();
            g.computeBoundingBox();
            const { min, max } = g.boundingBox;
            const sx = max.x - min.x || 1;
            const sy = max.y - min.y || 1;
            const sz = max.z - min.z || 1;

            const pos = g.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
            const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
            const tri = [a, b, c];

            for (let i = 0; i < pos.count; i += 3) {
              a.fromBufferAttribute(pos, i);
              b.fromBufferAttribute(pos, i + 1);
              c.fromBufferAttribute(pos, i + 2);
              ab.subVectors(b, a);
              ac.subVectors(c, a);
              n.crossVectors(ab, ac);

              const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
              for (let k = 0; k < 3; k++) {
                const p = tri[k];
                let u, v;
                if (ax >= ay && ax >= az) { u = (p.z - min.z) / sz; v = (p.y - min.y) / sy; }
                else if (ay >= az)        { u = (p.x - min.x) / sx; v = (p.z - min.z) / sz; }
                else                      { u = (p.x - min.x) / sx; v = (p.y - min.y) / sy; }
                uv[(i + k) * 2] = u;
                uv[(i + k) * 2 + 1] = v;
              }
            }

            g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            if (!g.attributes.normal) g.computeVertexNormals();
            mesh.geometry = g;
          }

          function drawUV() {
            const cv = canvases.uv;
            const ctx = cv.getContext('2d');
            ctx.fillStyle = '#05080f';
            ctx.fillRect(0, 0, S, S);

            ctx.globalAlpha = 0.55;
            ctx.drawImage(canvases.albedo, 0, 0, S, S);
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(0,229,255,0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i <= 8; i++) {
              const p = (i * S) / 8;
              ctx.moveTo(p, 0); ctx.lineTo(p, S);
              ctx.moveTo(0, p); ctx.lineTo(S, p);
            }
            ctx.stroke();

            const MAX_TRIS = 60000;
            let tris = 0;
            ctx.strokeStyle = 'rgba(0,229,255,0.9)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            model?.traverse((o) => {
              if (!o.isMesh) return;
              const uv = o.geometry.attributes.uv;
              if (!uv) return;
              const idx = o.geometry.index;
              const n = idx ? idx.count : uv.count;
              for (let i = 0; i < n; i += 3) {
                if (tris++ > MAX_TRIS) return;
                const a = idx ? idx.getX(i) : i;
                const b = idx ? idx.getX(i + 1) : i + 1;
                const c = idx ? idx.getX(i + 2) : i + 2;
                ctx.moveTo(uv.getX(a) * S, (1 - uv.getY(a)) * S);
                ctx.lineTo(uv.getX(b) * S, (1 - uv.getY(b)) * S);
                ctx.lineTo(uv.getX(c) * S, (1 - uv.getY(c)) * S);
                ctx.closePath();
              }
            });
            ctx.stroke();
          }

          // ---------- Normal desde altura ----------
          function bakeNormal() {
            const src = canvases.height.getContext('2d').getImageData(0, 0, S, S).data;
            const ctx = canvases.normal.getContext('2d');
            const out = ctx.createImageData(S, S);
            const o = out.data;

            const h = new Float32Array(S * S);
            for (let i = 0; i < S * S; i++) h[i] = src[i * 4] / 255;

            const k = brush.normalStrength;
            for (let y = 0; y < S; y++) {
              const yu = y > 0 ? y - 1 : 0;
              const yd = y < S - 1 ? y + 1 : S - 1;
              for (let x = 0; x < S; x++) {
                const xl = x > 0 ? x - 1 : 0;
                const xr = x < S - 1 ? x + 1 : S - 1;
                const dx = (h[y * S + xr] - h[y * S + xl]) * k;
                const dy = (h[yd * S + x] - h[yu * S + x]) * k;

                let nx = -dx, ny = dy, nz = 1;
                const inv = 1 / Math.hypot(nx, ny, nz);
                nx *= inv; ny *= inv; nz *= inv;

                const i = (y * S + x) * 4;
                o[i] = (nx * 0.5 + 0.5) * 255;
                o[i + 1] = (ny * 0.5 + 0.5) * 255;
                o[i + 2] = (nz * 0.5 + 0.5) * 255;
                o[i + 3] = 255;
              }
            }
            ctx.putImageData(out, 0, 0);
            dirty.normal = true;
          }

          painters.height.onStroke = bakeNormal;
          bakeNormal();

          // ---------- Modelo ----------
          function frame(obj) {
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const r = Math.max(size.x, size.y, size.z, 0.01) / 2;

            controls.target.copy(center);
            camera.position.copy(center).add(new THREE.Vector3(r * 1.8, r * 1.2, r * 2.6));
            camera.near = r / 100;
            camera.far = r * 200;
            camera.updateProjectionMatrix();

            grid.position.y = box.min.y;
            grid.scale.setScalar(Math.max(r, 0.5) / 2);
            controls.update();
          }

          function setModel(obj, name) {
            if (model) {
              modelGroup.remove(model);
              model.traverse((o) => o.geometry?.dispose());
            }
            model = obj;
            modelName = name;
            modelGroup.add(obj);

            let meshes = 0, tris = 0;
            obj.traverse((o) => {
              if (!o.isMesh) return;
              ensureUV(o);
              o.material = material;
              meshes++;
              const g = o.geometry;
              tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
            });

            frame(obj);
            $('info').textContent = `${name} · ${meshes} malla · ${Math.round(tris).toLocaleString()} tris`;
            drawUV();
          }

          const gltfLoader = new GLTFLoader();
          async function loadFile(file) {
            toast('Cargando modelo…');
            const url = URL.createObjectURL(file);
            try {
              const gltf = await gltfLoader.loadAsync(url);
              setModel(gltf.scene, file.name.replace(/\.(glb|gltf)$/i, ''));
              toast('Modelo listo');
            } finally {
              URL.revokeObjectURL(url);
            }
          }

          // Demo: caja sin UV para probar el auto-UV
          setModel(
            new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6).deleteAttribute('uv'), material),
            'demo_caja'
          );

          // ---------- Exportar ----------
          function safeName(s) { return s.replace(/[^\w\-]+/g, '_') || 'modelo'; }

          function blobToBase64(blob) {
            return new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(r.result.split(',')[1]);
              r.onerror = rej;
              r.readAsDataURL(blob);
            });
          }

          async function saveBlob(name, blob) {
            if (Capacitor.isNativePlatform()) {
              const data = await blobToBase64(blob);
              const res = await Filesystem.writeFile({ path: name, data, directory: Directory.Cache });
              await Share.share({ title: name, files: [res.uri] });
              return;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
          }

          function canvasBlob(cv) {
            return new Promise((res, rej) =>
              cv.toBlob((b) => (b ? res(b) : rej(new Error('No se pudo generar PNG'))), 'image/png')
            );
          }

          async function exportGLB() {
            if (!model) return toast('Carga un modelo primero');
            toast('Generando GLB…');
            const exporter = new GLTFExporter();
            const buf = await new Promise((res, rej) =>
              exporter.parse(model, res, rej, { binary: true, embedImages: true, maxTextureSize: S })
            );
            await saveBlob(`${safeName(modelName)}.glb`, new Blob([buf], { type: 'model/gltf-binary' }));
            toast('GLB exportado');
          }

          async function exportZIP() {
            toast('Empaquetando mapas…');
            const zip = new JSZip();
            const files = {
              'albedo.png': canvases.albedo,
              'height.png': canvases.height,
              'roughness.png': canvases.rough,
              'normal.png': canvases.normal,
              'uv_layout.png': canvases.uv
            };
            for (const [name, cv] of Object.entries(files)) {
              zip.file(name, await canvasBlob(cv));
            }
            zip.file(
              'README.txt',
              'UV Studio - mapas 1024x1024 PNG\n' +
              'albedo.png: color base\n' +
              'normal.png: normal map (convención OpenGL, +Y arriba)\n' +
              'roughness.png: escala de grises, blanco = más rugoso\n' +
              'height.png: altura usada para generar la normal\n' +
              'uv_layout.png: layout UV del modelo\n'
            );
            const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
            await saveBlob(`${safeName(modelName)}_maps.zip`, blob);
            toast('ZIP exportado');
          }

          // ---------- Tabs y herramientas ----------
          const cur = () => painters[currentTab];

          function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs button').forEach((b) =>
              b.classList.toggle('active', b.dataset.tab === tab)
            );
            for (const [key, cv] of Object.entries(canvases)) cv.classList.toggle('show', key === tab);
            document.querySelectorAll('[data-show]').forEach((el) => {
              el.hidden = !el.dataset.show.split(' ').includes(tab);
            });
            $('editorTitle').textContent = TITLES[tab];
            if (tab === 'uv') drawUV();
            syncTools();
          }

          function syncTools() {
            document.querySelectorAll('[data-tool]').forEach((b) =>
              b.classList.toggle('on', b.dataset.tool === brush.tool)
            );
          }

          document.querySelectorAll('.tabs button').forEach((b) =>
            b.addEventListener('click', () => setTab(b.dataset.tab))
          );
          document.querySelectorAll('[data-tool]').forEach((b) =>
            b.addEventListener('click', () => { brush.tool = b.dataset.tool; syncTools(); })
          );

          $('size').addEventListener('input', (e) => (brush.size = +e.target.value));
          $('opacity').addEventListener('input', (e) => (brush.opacity = e.target.value / 100));
          $('color').addEventListener('input', (e) => (brush.color = e.target.value));
          $('gray').addEventListener('input', (e) => (brush.gray = +e.target.value));
          $('strength').addEventListener('input', (e) => (brush.normalStrength = +e.target.value));
          $('strength').addEventListener('change', bakeNormal);

          on('btnUndo', 'click', () => cur()?.undo());
          on('btnClear', 'click', () => cur()?.clear());
          on('btnFill', 'click', () => { const p = cur(); if (p) p.fill(p.color()); });
          on('btnNoise', 'click', () => cur()?.noise(40));
          on('btnBake', 'click', () => bakeNormal());
          on('btnUVRefresh', 'click', () => drawUV());

          on('btnUnwrap', 'click', () => {
            if (!model) return toast('Carga un modelo');
            model.traverse((o) => { if (o.isMesh) ensureUV(o, true); });
            drawUV();
            toast('UV regenerados');
          });

          on('btnGLB', 'click', exportGLB);
          on('btnZIP', 'click', exportZIP);

          $('fileIn').addEventListener('change', (e) => {
            const f = e.target.files?.[0];
            e.target.value = '';
            if (f) loadFile(f).catch((err) => { console.error(err); toast('No se pudo leer el archivo'); });
          });

          setTab('albedo');
          syncTools();

          // ---------- Render loop ----------
          function resize() {
            const w = viewport.clientWidth, h = viewport.clientHeight;
            if (!w || !h) return;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
          }
          new ResizeObserver(resize).observe(viewport);
          resize();

          function tick() {
            requestAnimationFrame(tick);
            if (dirty.albedo) { textures.albedo.needsUpdate = true; dirty.albedo = false; }
            if (dirty.rough)  { textures.rough.needsUpdate = true;  dirty.rough = false; }
            if (dirty.normal) { textures.normal.needsUpdate = true; dirty.normal = false; }
            controls.update();
            renderer.render(scene, camera);
          }
          tick();

          document.addEventListener('contextmenu', (e) => e.preventDefault());
          EOF

          cat > .github/workflows/android-debug.yml <<'EOF'
          # Workflow de referencia generado por el script principal
          name: placeholder
          on: workflow_dispatch
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo "ok"
          EOF

          echo "Proyecto generado:"
          find . -path ./node_modules -prune -o -type f -print | grep -v '^./.git/' | sort

      - name: Instalar dependencias
        run: npm install

      - name: Compilar web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: uv-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
