              ]\n\tvar stride: float = float(ik_cfg[\"step_length\"])\n\tvar dur: float = float(ik_cfg[\"run_step_duration\"]) if state == \"hunt\" else float(ik_cfg[\"step_duration\"])\n\tvar forward: Vector3 =\
              \ -global_transform.basis.z\n\tvar lateral: Vector3 = global_transform.basis.x\n\tvar side_offset := {\"left\": -0.12, \"right\": 0.12}\n\tfor side in legs:\n\t\tvar leg: Dictionary = legs[side]\n\t\
