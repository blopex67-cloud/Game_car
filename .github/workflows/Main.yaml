name: Build Amyr APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias e instalar paquetes Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Descargar Godot 4.3
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          wget -q $BASE/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          wget -q $BASE/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          unzip -q godot.zip -d "$HOME/godot"
          sudo mv "$HOME/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d tpl_tmp
          mv tpl_tmp/templates/* "$TPL/"

      - name: Configurar Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Crear keystore de depuración
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Generar proyecto Godot
        run: |
          mkdir -p scripts scenes

          cat > project.godot << 'EOF'
          config_version=5

          [application]
          config/name="Amyr: El Pasillo"
          run/main_scene="res://scenes/Main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=0
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"

          [input_devices]
          pointing/emulate_mouse_from_touch=false
          pointing/emulate_touch_from_mouse=false

          [rendering]
          renderer/rendering_method="mobile"
          EOF

          cat > export_presets.cfg << 'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Amyr.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.amyr.horror"
          package/name="Amyr"
          package/signed=true
          package/retain_data_on_uninstall=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          cat > scenes/Main.tscn << 'EOF'
          [gd_scene format=3]

          [ext_resource type="Script" path="res://scripts/game.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/game.gd << 'EOF'
          extends Node3D

          const RATE := 22050
          const GRID := 2.5
          const WALL_H := 3.0
          const MAZE_W := 11
          const MAZE_H := 11
          const KEYS_NEEDED := 3
          const HAND_POS := Vector3(0.26, -0.24, -0.42)
          const MODEL_YAW_OFFSET := PI   # pon 0.0 si Amyr mira al lado contrario
          const VIG_SHADER := """
          shader_type canvas_item;
          uniform float strength = 0.75;
          float rnd(vec2 p) {
              return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }
          void fragment() {
              float v = smoothstep(0.25, 0.85, length(UV - vec2(0.5)) * 1.5);
              float g = rnd(UV * 900.0 + vec2(fract(TIME) * 37.0, 0.0)) * 0.08;
              COLOR = vec4(0.0, 0.0, 0.0, clamp(v * strength + g, 0.0, 1.0));
          }
          """

          var rng := RandomNumberGenerator.new()
          var maze: Array = []
          var last_cell := Vector2i(1, 1)
          var exit_cell := Vector2i.ZERO
          var key_cells: Array = []
          var key_nodes: Array = []
          var keys_found := 0
          var exit_mat: StandardMaterial3D
          var exit_light: OmniLight3D
          var lights: Array = []

          var player: CharacterBody3D
          var cam: Camera3D
          var hand: Node3D
          var flashlight: SpotLight3D
          var lamp_mat: StandardMaterial3D
          var battery := 100.0
          var flash_on := true
          var yaw := 0.0
          var pitch := 0.0
          var move_dir := Vector2.ZERO
          var walk_amt := 0.0
          var step_timer := 0.0
          var touch_move_id := -1
          var touch_move_origin := Vector2.ZERO
          var touch_look_id := -1
          var touch_look_moved := 0.0

          var monster: CharacterBody3D
          var model_root: Node3D
          var model_base_scale := Vector3.ONE
          var monster_target := Vector3.ZERO
          var monster_path_timer := 0.0
          var closeness := 0.0

          var state := "play"
          var state_timer := 0.0
          var shake := 0.0
          var time := 0.0
          var heart_timer := 0.0
          var creak_timer := 6.0
          var msg_timer := 0.0

          var drone: AudioStreamPlayer
          var heart_sfx: AudioStreamPlayer
          var scare_sfx: AudioStreamPlayer
          var step_sfx: AudioStreamPlayer
          var fx_sfx: AudioStreamPlayer
          var s_chime: AudioStreamWAV
          var s_creak: AudioStreamWAV
          var s_step: AudioStreamWAV

          var vig_mat: ShaderMaterial
          var hud: Label
          var msg: Label
          var flash_rect: ColorRect

          func _ready() -> void:
              rng.randomize()
              _make_sounds()
              _setup_environment()
              _generate_maze()
              _build_world()
              _build_player()
              _build_monster()
              _build_ui()
              drone.play()
              if OS.has_feature("pc"):
                  Input.mouse_mode = Input.MOUSE_MODE_CAPTURED
              _show_msg("Encuentra las 3 llaves doradas y escapa.", 4.0)

          # ---------- AUDIO PROCEDURAL ----------
          func _wav(s: PackedFloat32Array, loop := false) -> AudioStreamWAV:
              var data := PackedByteArray()
              data.resize(s.size() * 2)
              for i in s.size():
                  data.encode_s16(i * 2, int(clampf(s[i], -1.0, 1.0) * 32767.0))
              var w := AudioStreamWAV.new()
              w.format = AudioStreamWAV.FORMAT_16_BITS
              w.mix_rate = RATE
              w.stereo = false
              w.data = data
              if loop:
                  w.loop_mode = AudioStreamWAV.LOOP_FORWARD
                  w.loop_begin = 0
                  w.loop_end = s.size()
              return w

          func _make_sounds() -> void:
              drone = AudioStreamPlayer.new(); add_child(drone)
              heart_sfx = AudioStreamPlayer.new(); add_child(heart_sfx)
              scare_sfx = AudioStreamPlayer.new(); add_child(scare_sfx)
              step_sfx = AudioStreamPlayer.new(); add_child(step_sfx)
              fx_sfx = AudioStreamPlayer.new(); add_child(fx_sfx)
              drone.stream = _make_drone()
              drone.volume_db = -14.0
              heart_sfx.stream = _make_heart()
              heart_sfx.volume_db = -2.0
              scare_sfx.stream = _make_scream()
              scare_sfx.volume_db = 6.0
              s_step = _make_step()
              s_chime = _make_chime()
              s_creak = _make_creak()
              step_sfx.stream = s_step
              step_sfx.volume_db = -6.0

          func _make_drone() -> AudioStreamWAV:
              var n := RATE * 4
              var s := PackedFloat32Array()
              s.resize(n)
              for i in n:
                  var t := float(i) / RATE
                  var v := sin(TAU * 55.0 * t) * 0.18 + sin(TAU * 58.5 * t) * 0.14 + sin(TAU * 110.0 * t) * 0.05
                  v *= 0.6 + 0.4 * sin(TAU * 0.25 * t)
                  s[i] = v
              return _wav(s, true)

          func _make_heart() -> AudioStreamWAV:
              var n := int(RATE * 0.9)
              var s := PackedFloat32Array()
              s.resize(n)
              for i in n:
                  var t := float(i) / RATE
                  var v := 0.0
                  for off in [0.0, 0.3]:
                      var dt: float = t - off
                      if dt >= 0.0 and dt < 0.3:
                          v += sin(TAU * 58.0 * dt) * exp(-dt * 20.0)
                  s[i] = v * 0.9
              return _wav(s)

          func _make_scream() -> AudioStreamWAV:
              var n := int(RATE * 1.6)
              var s := PackedFloat32Array()
              s.resize(n)
              var ph := 0.0
              for i in n:
                  var t := float(i) / RATE
                  var u := t / 1.6
                  var f := lerpf(280.0, 1100.0, u) + sin(t * 55.0) * 70.0
                  ph += TAU * f / RATE
                  var env := minf(1.0, t * 30.0) * (1.0 - u)
                  var v := sin(ph) * 0.6 + sin(ph * 2.01) * 0.3 + (randf() * 2.0 - 1.0) * 0.4
                  s[i] = clampf(v * 2.2, -1.0, 1.0) * env
              return _wav(s)

          func _make_step() -> AudioStreamWAV:
              var n := int(RATE * 0.09)
              var s := PackedFloat32Array()
              s.resize(n)
              for i in n:
                  var t := float(i) / n
                  s[i] = (randf() * 2.0 - 1.0) * pow(1.0 - t, 3.0) * 0.8
              return _wav(s)

          func _make_chime() -> AudioStreamWAV:
              var n := int(RATE * 0.9)
              var s := PackedFloat32Array()
              s.resize(n)
              for i in n:
                  var t := float(i) / RATE
                  var v := (sin(TAU * 880.0 * t) * 0.5 + sin(TAU * 1320.0 * t) * 0.3) * exp(-t * 4.0)
                  s[i] = v * 0.7
              return _wav(s)

          func _make_creak() -> AudioStreamWAV:
              var n := int(RATE * 1.6)
              var s := PackedFloat32Array()
              s.resize(n)
              var ph := 0.0
              for i in n:
                  var t := float(i) / RATE
                  var f := 70.0 + 60.0 * sin(t * 3.0) + 30.0 * t
                  ph += TAU * f / RATE
                  var env := sin(PI * t / 1.6)
                  s[i] = (sin(ph) * 0.4 + (randf() * 2.0 - 1.0) * 0.25) * env * 0.8
              return _wav(s)

          # ---------- ENTORNO ----------
          func _setup_environment() -> void:
              var we := WorldEnvironment.new()
              var env := Environment.new()
              env.background_mode = Environment.BG_COLOR
              env.background_color = Color(0.01, 0.01, 0.015)
              env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color = Color(0.08, 0.08, 0.1)
              env.ambient_light_energy = 0.6
              env.fog_enabled = true
              env.fog_light_color = Color(0.03, 0.03, 0.04)
              env.fog_density = 0.045
              env.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              env.adjustment_enabled = true
              env.adjustment_contrast = 1.15
              env.adjustment_saturation = 0.55
              we.environment = env
              add_child(we)

          # ---------- LABERINTO ----------
          func _generate_maze() -> void:
              var gw := MAZE_W * 2 + 1
              var gh := MAZE_H * 2 + 1
              maze = []
              for y in gh:
                  var row: Array = []
                  for x in gw:
                      row.append(true)
                  maze.append(row)
              var visited := {}
              var stack: Array[Vector2i] = [Vector2i(1, 1)]
              maze[1][1] = false
              visited[Vector2i(1, 1)] = true
              while stack.size() > 0:
                  var cur: Vector2i = stack.back()
                  var dirs := [Vector2i(2, 0), Vector2i(-2, 0), Vector2i(0, 2), Vector2i(0, -2)]
                  dirs.shuffle()
                  var moved := false
                  for d in dirs:
                      var nxt: Vector2i = cur + d
                      if nxt.x < 1 or nxt.y < 1 or nxt.x >= gw - 1 or nxt.y >= gh - 1:
                          continue
                      if visited.has(nxt):
                          continue
                      var between: Vector2i = cur + d / 2
                      maze[between.y][between.x] = false
                      maze[nxt.y][nxt.x] = false
                      visited[nxt] = true
                      stack.append(nxt)
                      last_cell = nxt
                      moved = true
                      break
                  if not moved:
                      stack.pop_back()

              exit_cell = last_cell
              var open := _open_cells()
              open.shuffle()
              key_cells = []
              for c in open:
                  if key_cells.size() >= KEYS_NEEDED:
                      break
                  if _dist(c, Vector2i(1, 1)) > 4.0 and _dist(c, exit_cell) > 2.0:
                      key_cells.append(c)

          func _open_cells() -> Array:
              var out: Array = []
              for y in maze.size():
                  for x in maze[y].size():
                      if not maze[y][x]:
                          out.append(Vector2i(x, y))
              return out

          func _is_open(c: Vector2i) -> bool:
              return c.y >= 0 and c.y < maze.size() and c.x >= 0 and c.x < maze[0].size() and not maze[c.y][c.x]

          func _cell_world(c: Vector2i) -> Vector3:
              return Vector3(c.x * GRID, 0.0, c.y * GRID)

          func _world_cell(p: Vector3) -> Vector2i:
              return Vector2i(roundi(p.x / GRID), roundi(p.z / GRID))

          func _dist(a: Vector2i, b: Vector2i) -> float:
              return Vector2(a).distance_to(Vector2(b))

          func _flat_dist(a: Vector3, b: Vector3) -> float:
              return Vector2(a.x, a.z).distance_to(Vector2(b.x, b.z))

          func _build_world() -> void:
              var gw: int = maze[0].size()
              var gh: int = maze.size()
              var span := maxf(float(gw), float(gh)) * GRID * 2.0
              var center := Vector3((gw - 1) * GRID * 0.5, 0.0, (gh - 1) * GRID * 0.5)

              _add_block(Vector3(center.x, -0.1, center.z), Vector3(span, 0.2, span), _mat(Color(0.12, 0.1, 0.08), 0.95))

              var ceil_mi := MeshInstance3D.new()
              var pm := PlaneMesh.new()
              pm.size = Vector2(span, span)
              ceil_mi.mesh = pm
              ceil_mi.material_override = _mat(Color(0.05, 0.05, 0.06), 1.0)
              ceil_mi.position = Vector3(center.x, WALL_H, center.z)
              ceil_mi.rotation.x = PI
              add_child(ceil_mi)

              var wall_mat := _mat(Color(0.24, 0.2, 0.16), 0.9)
              for y in gh:
                  for x in gw:
                      if maze[y][x]:
                          _add_block(Vector3(x * GRID, WALL_H * 0.5, y * GRID), Vector3(GRID, WALL_H, GRID), wall_mat)

              var n := 0
              for c in _open_cells():
                  if (c.x + c.y * 3) % 4 == 0 and n < 26:
                      _add_ceiling_light(c)
                      n += 1

              key_nodes.clear()
              for c in key_cells:
                  var holder := Node3D.new()
                  holder.position = _cell_world(c)
                  var k := _box(Vector3(0.28, 0.12, 0.12), _mat(Color(1.0, 0.8, 0.2), 0.3, true), Vector3(0.0, 0.9, 0.0))
                  holder.add_child(k)
                  var kl := OmniLight3D.new()
                  kl.position = Vector3(0.0, 1.0, 0.0)
                  kl.light_color = Color(1.0, 0.8, 0.3)
                  kl.omni_range = 3.0
                  kl.light_energy = 0.9
                  holder.add_child(kl)
                  add_child(holder)
                  key_nodes.append(holder)

              var ep := _cell_world(exit_cell)
              exit_mat = _mat(Color(0.6, 0.05, 0.05), 0.5, true)
              add_child(_box(Vector3(GRID * 0.9, WALL_H * 0.8, 0.12), exit_mat, Vector3(ep.x, WALL_H * 0.4, ep.z)))
              exit_light = OmniLight3D.new()
              exit_light.position = Vector3(ep.x, 1.5, ep.z)
              exit_light.light_color = Color(1.0, 0.2, 0.2)
              exit_light.omni_range = 5.0
              exit_light.light_energy = 1.5
              add_child(exit_light)

          func _add_ceiling_light(c: Vector2i) -> void:
              var p := _cell_world(c)
              add_child(_box(Vector3(0.6, 0.05, 0.6), _mat(Color(1.0, 0.9, 0.7), 0.5, true), Vector3(p.x, WALL_H - 0.05, p.z)))
              var l := OmniLight3D.new()
              l.position = Vector3(p.x, WALL_H - 0.3, p.z)
              l.light_color = Color(1.0, 0.78, 0.5)
              l.omni_range = 7.0
              l.light_energy = 1.4
              add_child(l)
              lights.append({"node": l, "base": 1.4, "off": 0.0, "phase": rng.randf() * TAU})

          func _add_block(pos: Vector3, size: Vector3, mat: Material) -> StaticBody3D:
              var body := StaticBody3D.new()
              body.position = pos
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = mat
              body.add_child(mi)
              var cs := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              cs.shape = bs
              body.add_child(cs)
              add_child(body)
              return body

          func _box(size: Vector3, mat: Material, pos: Vector3) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = mat
              mi.position = pos
              return mi

          func _mat(c: Color, rough := 0.9, emit := false) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.roughness = rough
              if emit:
                  m.emission_enabled = true
                  m.emission = c
                  m.emission_energy_multiplier = 2.0
              return m

          # ---------- JUGADOR, MANO Y LINTERNA ----------
          func _build_player() -> void:
              player = CharacterBody3D.new()
              player.position = _cell_world(Vector2i(1, 1))
              var cs := CollisionShape3D.new()
              var cap := CapsuleShape3D.new()
              cap.radius = 0.3
              cap.height = 1.7
              cs.shape = cap
              cs.position.y = 0.85
              player.add_child(cs)

              cam = Camera3D.new()
              cam.position = Vector3(0.0, 1.6, 0.0)
              cam.fov = 72.0
              cam.near = 0.05
              cam.far = 80.0
              player.add_child(cam)
              add_child(player)
              cam.current = true

              hand = Node3D.new()
              hand.position = HAND_POS
              cam.add_child(hand)
              var skin := _mat(Color(0.72, 0.55, 0.45), 0.7)
              var sleeve := _mat(Color(0.1, 0.1, 0.12), 0.9)
              hand.add_child(_box(Vector3(0.11, 0.11, 0.4), sleeve, Vector3(0.0, -0.06, 0.22)))
              hand.add_child(_box(Vector3(0.1, 0.1, 0.1), skin, Vector3.ZERO))
              hand.add_child(_box(Vector3(0.09, 0.035, 0.1), skin, Vector3(0.0, -0.06, -0.06)))
              hand.add_child(_box(Vector3(0.04, 0.04, 0.12), skin, Vector3(-0.05, 0.0, -0.02)))

              var body_mat := _mat(Color(0.15, 0.15, 0.17), 0.4)
              var barrel := MeshInstance3D.new()
              var cyl := CylinderMesh.new()
              cyl.top_radius = 0.035
              cyl.bottom_radius = 0.04
              cyl.height = 0.2
              barrel.mesh = cyl
              barrel.material_override = body_mat
              barrel.rotation.x = PI * 0.5
              barrel.position = Vector3(0.0, 0.02, -0.1)
              hand.add_child(barrel)

              lamp_mat = _mat(Color(1.0, 0.97, 0.85), 0.2, true)
              var lens := MeshInstance3D.new()
              var sph := SphereMesh.new()
              sph.radius = 0.032
              sph.height = 0.064
              lens.mesh = sph
              lens.material_override = lamp_mat
              lens.position = Vector3(0.0, 0.02, -0.2)
              hand.add_child(lens)

              flashlight = SpotLight3D.new()
              flashlight.light_color = Color(1.0, 0.95, 0.8)
              flashlight.light_energy = 6.0
              flashlight.spot_range = 22.0
              flashlight.spot_angle = 26.0
              flashlight.spot_attenuation = 0.6
              flashlight.shadow_enabled = false
              flashlight.position = Vector3(0.0, 0.02, -0.22)
              hand.add_child(flashlight)

              # Polvo en el haz de luz
              var dust := CPUParticles3D.new()
              dust.amount = 80
              dust.lifetime = 5.0
              dust.preprocess = 3.0
              dust.local_coords = false
              dust.emission_shape = CPUParticles3D.EMISSION_SHAPE_BOX
              dust.emission_box_extents = Vector3(2.5, 1.5, 6.0)
              dust.gravity = Vector3.ZERO
              dust.initial_velocity_min = 0.0
              dust.initial_velocity_max = 0.05
              dust.scale_amount_min = 0.4
              dust.scale_amount_max = 1.0
              var dm := SphereMesh.new()
              dm.radius = 0.012
              dm.height = 0.024
              var dmat := StandardMaterial3D.new()
              dmat.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              dmat.albedo_color = Color(1.0, 1.0, 0.9, 0.5)
              dmat.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              dm.material = dmat
              dust.mesh = dm
              dust.position = Vector3(0.0, 0.0, -6.0)
              cam.add_child(dust)

          # ---------- AMYR (ENEMIGO) ----------
          func _build_monster() -> void:
              monster = CharacterBody3D.new()
              monster.position = _cell_world(_far_open_cell(Vector2i(1, 1), 7.0))
              var cs := CollisionShape3D.new()
              var cap := CapsuleShape3D.new()
              cap.radius = 0.4
              cap.height = 1.9
              cs.shape = cap
              cs.position.y = 0.95
              monster.add_child(cs)
              add_child(monster)

              model_root = Node3D.new()
              monster.add_child(model_root)
              _load_amyr(model_root)
              model_base_scale = model_root.scale
              monster_target = monster.position

          func _far_open_cell(from: Vector2i, min_dist: float) -> Vector2i:
              var opts: Array = []
              for c in _open_cells():
                  if _dist(c, from) > min_dist:
                      opts.append(c)
              if opts.is_empty():
                  return last_cell
              return opts.pick_random()

          func _load_amyr(holder: Node3D) -> void:
              var path := "res://assets/Amyr.fbx"
              var ok := false
              if ResourceLoader.exists(path):
                  var ps := load(path) as PackedScene
                  if ps:
                      var inst := ps.instantiate() as Node3D
                      holder.add_child(inst)
                      _fit_height(holder, 2.1)
                      _play_anim(inst)
                      ok = true
              if not ok:
                  holder.add_child(_box(Vector3(0.7, 2.0, 0.45), _mat(Color(0.04, 0.04, 0.04), 1.0), Vector3(0.0, 1.0, 0.0)))
              holder.rotation.y = MODEL_YAW_OFFSET

          func _fit_height(root: Node3D, target: float) -> void:
              var h := 0.0
              for mi in _meshes(root):
                  h = maxf(h, mi.get_aabb().size.y * mi.global_transform.basis.get_scale().y)
              if h > 0.001:
                  root.scale *= target / h

          func _meshes(n: Node) -> Array:
              var out: Array = []
              if n is MeshInstance3D:
                  out.append(n)
              for c in n.get_children():
                  out.append_array(_meshes(c))
              return out

          func _play_anim(root: Node) -> void:
              var ap := _find_anim(root)
              if ap == null:
                  return
              var names := ap.get_animation_list()
              if names.size() > 0:
                  ap.get_animation(names[0]).loop_mode = Animation.LOOP_LINEAR
                  ap.play(names[0])

          func _find_anim(n: Node) -> AnimationPlayer:
              if n is AnimationPlayer:
                  return n as AnimationPlayer
              for c in n.get_children():
                  var r := _find_anim(c)
                  if r != null:
                      return r
              return null

          func _next_step(from_c: Vector2i, to_c: Vector2i) -> Vector2i:
              var prev := {from_c: from_c}
              var q: Array[Vector2i] = [from_c]
              var found := false
              while q.size() > 0:
                  var c: Vector2i = q.pop_front()
                  if c == to_c:
                      found = true
                      break
                  for d in [Vector2i(1, 0), Vector2i(-1, 0), Vector2i(0, 1), Vector2i(0, -1)]:
                      var n: Vector2i = c + d
                      if not _is_open(n) or prev.has(n):
                          continue
                      prev[n] = c
                      q.append(n)
              if not found:
                  return from_c
              var cur := to_c
              while prev[cur] != from_c:
                  cur = prev[cur]
              return cur

          func _is_lit(p: Vector3) -> bool:
              if not flash_on or flashlight.light_energy <= 0.0:
                  return false
              var lp := flashlight.global_position
              var to := p - lp
              if to.length() > flashlight.spot_range:
                  return false
              var fwd := -flashlight.global_transform.basis.z
              if fwd.angle_to(to.normalized()) > deg_to_rad(flashlight.spot_angle):
                  return false
              var q := PhysicsRayQueryParameters3D.create(lp, p)
              q.exclude = [player.get_rid()]
              var hit := get_world_3d().direct_space_state.intersect_ray(q)
              return hit.is_empty() or hit["collider"] == monster

          # ---------- UI ----------
          func _build_ui() -> void:
              var layer := CanvasLayer.new()
              add_child(layer)

              var vig := ColorRect.new()
              vig.set_anchors_preset(Control.PRESET_FULL_RECT)
              vig.mouse_filter = Control.MOUSE_FILTER_IGNORE
              var sh := Shader.new()
              sh.code = VIG_SHADER
              vig_mat = ShaderMaterial.new()
              vig_mat.shader = sh
              vig.material = vig_mat
              layer.add_child(vig)

              hud = Label.new()
              hud.position = Vector2(16, 12)
              hud.add_theme_font_size_override("font_size", 22)
              hud.add_theme_color_override("font_color", Color(0.85, 0.8, 0.7))
              layer.add_child(hud)

              msg = Label.new()
              msg.set_anchors_preset(Control.PRESET_FULL_RECT)
              msg.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              msg.vertical_alignment = VERTICAL_ALIGNMENT_CENTER
              msg.add_theme_font_size_override("font_size", 40)
              msg.add_theme_color_override("font_color", Color(0.9, 0.2, 0.2))
              msg.mouse_filter = Control.MOUSE_FILTER_IGNORE
              layer.add_child(msg)

              flash_rect = ColorRect.new()
              flash_rect.set_anchors_preset(Control.PRESET_FULL_RECT)
              flash_rect.color = Color(0.6, 0.0, 0.0, 0.0)
              flash_rect.mouse_filter = Control.MOUSE_FILTER_IGNORE
              layer.add_child(flash_rect)

          func _show_msg(t: String, dur: float) -> void:
              msg.text = t
              msg_timer = dur
              msg.modulate.a = 1.0

          func _update_hud() -> void:
              hud.text = "Llaves: %d/%d    Pila: %d%%" % [keys_found, KEYS_NEEDED, int(battery)]

          # ---------- BUCLES ----------
          func _process(delta: float) -> void:
              time += delta
              if state != "play":
                  state_timer += delta
              cam.rotation.x = pitch
              _update_flashlight(delta)
              _update_lights(delta)
              _update_keys(delta)
              _update_heartbeat(delta)
              _update_creak(delta)
              _update_hud()

              shake = maxf(0.0, shake - delta * 2.0)
              var jitter := Vector3(randf_range(-1.0, 1.0), randf_range(-1.0, 1.0), 0.0) * shake * 0.08
              cam.position = Vector3(0.0, 1.6 + sin(time * 9.0) * 0.03 * walk_amt, 0.0) + jitter
              hand.position = HAND_POS + Vector3(0.0, sin(time * 9.0) * 0.012 * walk_amt, 0.0)

              vig_mat.set_shader_parameter("strength", lerpf(0.7, 1.0, closeness))

              if msg_timer > 0.0:
                  msg_timer -= delta
                  if msg_timer < 0.6:
                      msg.modulate.a = clampf(msg_timer / 0.6, 0.0, 1.0)

          func _physics_process(delta: float) -> void:
              if state == "play":
                  player.rotation.y = yaw
                  _player_move(delta)
                  _check_goal()
                  _update_monster(delta)
              else:
                  player.velocity = Vector3.ZERO
                  player.move_and_slide()

          func _player_move(delta: float) -> void:
              var inp := Vector2.ZERO
              if Input.is_key_pressed(KEY_W) or Input.is_key_pressed(KEY_UP):
                  inp.y += 1.0
              if Input.is_key_pressed(KEY_S) or Input.is_key_pressed(KEY_DOWN):
                  inp.y -= 1.0
              if Input.is_key_pressed(KEY_A) or Input.is_key_pressed(KEY_LEFT):
                  inp.x -= 1.0
              if Input.is_key_pressed(KEY_D) or Input.is_key_pressed(KEY_RIGHT):
                  inp.x += 1.0
              inp += Vector2(move_dir.x, -move_dir.y)
              inp = inp.limit_length(1.0)

              var b := player.global_transform.basis
              var dir := -b.z * inp.y + b.x * inp.x
              var v := player.velocity
              v.x = dir.x * 2.4
              v.z = dir.z * 2.4
              v.y -= 9.8 * delta
              player.velocity = v
              player.move_and_slide()

              var moving := inp.length() > 0.1 and player.is_on_floor()
              walk_amt = lerpf(walk_amt, 1.0 if moving else 0.0, minf(1.0, delta * 8.0))
              if moving:
                  step_timer -= delta
                  if step_timer <= 0.0:
                      step_timer = 0.48
                      step_sfx.pitch_scale = randf_range(0.7, 1.0)
                      step_sfx.play()
              else:
                  step_timer = 0.0

          func _check_goal() -> void:
              if _flat_dist(player.global_position, _cell_world(exit_cell)) < 1.6:
                  if keys_found >= KEYS_NEEDED:
                      _end("win")
                  elif msg_timer <= 0.0:
                      _show_msg("La salida está sellada. Busca las %d llaves." % KEYS_NEEDED, 2.5)

          func _update_monster(delta: float) -> void:
              var pp := player.global_position
              var mp := monster.global_position
              var dist := _flat_dist(pp, mp)
              if dist < 1.3:
                  _jumpscare()
                  return

              monster_path_timer -= delta
              if monster_path_timer <= 0.0:
                  monster_path_timer = 0.45
                  var nxt := _next_step(_world_cell(mp), _world_cell(pp))
                  monster_target = _cell_world(nxt)

              var speed := 1.9 if dist > 8.0 else 2.9
              if _is_lit(mp + Vector3(0.0, 1.0, 0.0)):
                  speed *= 0.3

              var to := monster_target - mp
              to.y = 0.0
              var v := Vector3.ZERO
              if to.length() > 0.05:
                  v = to.normalized() * speed
                  monster.rotation.y = atan2(-v.x, -v.z)
              monster.velocity = v
              monster.move_and_slide()

          func _jumpscare() -> void:
              if state != "play":
                  return
              state = "jump"
              state_timer = 0.0
              player.velocity = Vector3.ZERO
              flash_on = false
              flashlight.light_energy = 0.0
              _show_msg("", 0.0)

              var fwd := -cam.global_transform.basis.z
              var face := cam.global_position + fwd * 0.9
              monster.global_position = Vector3(face.x, 0.0, face.z)
              var toc := cam.global_position - monster.global_position
              monster.rotation.y = atan2(-toc.x, -toc.z)
              model_root.scale = model_base_scale * 1.25

              shake = 1.5
              scare_sfx.play()
              drone.volume_db = -40.0

              var tw := create_tween()
              tw.tween_property(flash_rect, "color:a", 0.95, 0.06)
              tw.tween_property(flash_rect, "color:a", 0.0, 0.9)
              tw.tween_interval(0.6)
              tw.tween_callback(_end.bind("dead"))

          func _end(kind: String) -> void:
              state = kind
              state_timer = 0.0
              drone.stop()
              heart_sfx.stop()
              if kind == "win":
                  exit_light.light_color = Color(0.3, 1.0, 0.3)
                  _show_msg("¡ESCAPASTE!\nToca para reiniciar", 99999.0)
              else:
                  _show_msg("TE ATRAPÓ\nToca para reiniciar", 99999.0)

          # ---------- EFECTOS ----------
          func _update_flashlight(delta: float) -> void:
              if flash_on:
                  battery = maxf(0.0, battery - 0.9 * delta)
                  if battery <= 0.0:
                      flash_on = false
                      _show_msg("La pila se agotó...", 2.5)
              var e := 0.0
              if flash_on:
                  e = 6.0
                  if battery < 25.0 and randf() < 0.08:
                      e = 6.0 * randf() * 0.4
              flashlight.light_energy = e
              lamp_mat.emission_energy_multiplier = 3.0 if flash_on else 0.1

          func _update_lights(delta: float) -> void:
              for e in lights:
                  var l: OmniLight3D = e.node
                  if e.off > 0.0:
                      e.off -= delta
                      l.light_energy = 0.05
                  else:
                      l.light_energy = e.base * (0.9 + 0.1 * sin(time * 6.0 + e.phase))
                      if rng.randf() < 0.003:
                          e.off = rng.randf_range(0.05, 0.35)

          func _update_keys(delta: float) -> void:
              for i in key_nodes.size():
                  var k: Node3D = key_nodes[i]
                  if not k.visible:
                      continue
                  k.rotate_y(delta * 1.6)
                  if _flat_dist(player.global_position, _cell_world(key_cells[i])) < 1.6:
                      k.visible = false
                      keys_found += 1
                      fx_sfx.stream = s_chime
                      fx_sfx.pitch_scale = 1.0
                      fx_sfx.play()
                      _show_msg("Llave %d de %d" % [keys_found, KEYS_NEEDED], 2.0)
                      if keys_found == KEYS_NEEDED:
                          _unlock_exit()

          func _unlock_exit() -> void:
              exit_mat.albedo_color = Color(0.1, 0.6, 0.1)
              exit_mat.emission = Color(0.2, 1.0, 0.2)
              exit_light.light_color = Color(0.3, 1.0, 0.3)
              _show_msg("¡La salida está abierta!", 3.0)

          func _update_heartbeat(delta: float) -> void:
              if monster == null:
                  return
              var d := _flat_dist(player.global_position, monster.global_position)
              closeness = clampf(1.0 - d / 12.0, 0.0, 1.0)
              drone.volume_db = lerpf(-16.0, -4.0, closeness)
              if state != "play":
                  return
              heart_timer -= delta
              if heart_timer <= 0.0:
                  heart_sfx.play()
                  heart_timer = lerpf(1.2, 0.45, closeness)

          func _update_creak(delta: float) -> void:
              creak_timer -= delta
              if creak_timer <= 0.0:
                  fx_sfx.stream = s_creak
                  fx_sfx.pitch_scale = randf_range(0.8, 1.2)
                  fx_sfx.play()
                  creak_timer = randf_range(7.0, 16.0)

          # ---------- ENTRADA ----------
          func _input(event: InputEvent) -> void:
              if event is InputEventMouseMotion and Input.mouse_mode == Input.MOUSE_MODE_CAPTURED:
                  _look((event as InputEventMouseMotion).relative * 0.0025)
              elif event is InputEventScreenDrag:
                  _drag(event as InputEventScreenDrag)
              elif event is InputEventScreenTouch:
                  _touch(event as InputEventScreenTouch)
              elif event is InputEventMouseButton and (event as InputEventMouseButton).pressed:
                  _on_click()
              elif event is InputEventKey and (event as InputEventKey).pressed and not (event as InputEventKey).echo:
                  _on_key((event as InputEventKey).keycode)

          func _look(d: Vector2) -> void:
              if state != "play":
                  return
              yaw -= d.x
              pitch = clampf(pitch - d.y, -1.3, 1.3)

          func _touch(e: InputEventScreenTouch) -> void:
              if e.pressed and (state == "dead" or state == "win"):
                  _try_restart()
                  return
              if state != "play":
                  return
              var half := get_viewport().get_visible_rect().size.x * 0.5
              if e.pressed:
                  if e.position.x < half and touch_move_id == -1:
                      touch_move_id = e.index
                      touch_move_origin = e.position
                  elif e.position.x >= half and touch_look_id == -1:
                      touch_look_id = e.index
                      touch_look_moved = 0.0
              else:
                  if e.index == touch_move_id:
                      touch_move_id = -1
                      move_dir = Vector2.ZERO
                  elif e.index == touch_look_id:
                      if touch_look_moved < 12.0:
                          _toggle_flash()
                      touch_look_id = -1

          func _drag(e: InputEventScreenDrag) -> void:
              if state != "play":
                  return
              if e.index == touch_move_id:
                  move_dir = ((e.position - touch_move_origin) / 90.0).limit_length(1.0)
              elif e.index == touch_look_id:
                  touch_look_moved += e.relative.length()
                  _look(e.relative * 0.005)

          func _on_click() -> void:
              if state == "dead" or state == "win":
                  _try_restart()
                  return
              if Input.mouse_mode != Input.MOUSE_MODE_CAPTURED:
                  Input.mouse_mode = Input.MOUSE_MODE_CAPTURED
              else:
                  _toggle_flash()

          func _on_key(k: Key) -> void:
              if state == "dead" or state == "win":
                  _try_restart()
                  return
              if k == KEY_F:
                  _toggle_flash()
              elif k == KEY_ESCAPE:
                  Input.mouse_mode = Input.MOUSE_MODE_VISIBLE

          func _toggle_flash() -> void:
              if battery <= 0.0 or state != "play":
                  return
              flash_on = not flash_on
              fx_sfx.stream = s_step
              fx_sfx.pitch_scale = 1.5
              fx_sfx.play()

          func _try_restart() -> void:
              if state_timer > 1.2:
                  get_tree().reload_current_scene()
          EOF

      - name: Importar recursos (FBX incluido)
        run: godot --headless --path . --import || true

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Amyr.apk
          ls -lh build/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Amyr-APK
          path: build/Amyr.apk
