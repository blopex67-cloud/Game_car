              \ * 6.0, 0.0, 1.0))\n\nfunc _move_toward(dir: Vector3, speed: float, delta: float) -> void:\n\tglobal_position += dir * speed * delta\n\tglobal_position.y = 0.0\n\n# IK de piernas: paso alternado; el\
