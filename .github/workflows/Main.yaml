escena: "Pasillo del Abismo"
configuracion_global:
  atmosfera:
    iluminacion: "baja_estatica_parpadeante"
    visibilidad_porcentaje: 40
    audio_ambiente: "zumbido_baja_frecuencia_3d"
  jugador:
    posicion_inicial: "Punto_A"
    inventario:
      linterna:
        estado_inicial: "encendida"
        bateria_porcentaje: 60
  entidad:
    nombre: "Amyr"
    estado_inicial: "inactivo"
    posicion_inicial: "fuera_de_mapa"

triggers:
  - id: "Trigger_01"
    condicion: "Jugador avanza 8 metros o interactúa con el primer objeto"
    acciones:
      - tipo: "cambiar_estado_luz"
        objetivo: "Luz_Principal"
        nuevo_estado: "OFF"
      - tipo: "reproducir_audio"
        archivo: "susurro_distante_3d.wav"
        volumen: 0.8
      - tipo: "efecto_camara"
        tipo_efecto: "distorsion"
        duracion_segundos: 1.5
      - tipo: "mostrar_texto"
        contenido: "El aire se siente helado. Necesito salir de aquí antes de que las luces se apaguen por completo..."

  - id: "Trigger_02"
    condicion: "Jugador llega a la mitad del pasillo"
    acciones:
      - tipo: "spawn_entidad"
        entidad: "Amyr"
        punto: "Punto_B"
      - tipo: "cambiar_estado_ia"
        entidad: "Amyr"
        modo: "PERSECUCION"
      - tipo: "reproducir_audio"
        archivo: "tension_in_crescendo.wav"
        tipo: "musica_fondo"
      - tipo: "evento_narrativo"
        descripcion: "Un chasquido resonante se escucha al fondo. Amyr fija su mirada en el jugador."

condiciones_fin_escena:
  exito:
    condicion: "Jugador cruza la puerta final y acciona el cerrojo"
    resultado:
      - transicion: "pantalla_en_negro"
      - audio: "respiracion_agitada"
      - detener_musica: true
  fallo:
    condicion: "Distancia entre Amyr y Jugador < 2.0 metros"
    resultado:
      - bloquear_controles: true
      - efecto_visual: "screamer_impacto"
      - accion: "reiniciar_punto_de_control"
