              eye_height\"]) + (sin(bob_t) * bob_amount if moving else 0.0)\n"
            scripts/amyr.gd: "extends Node3D\n## Amyr: máquina de estados + IK de piernas y brazos (SkeletonIK3D, Godot 4.3).\n\nvar cfg: Dictionary\nvar scen: Dictionary\nvar audio\nvar player\nvar world\nvar model:\
