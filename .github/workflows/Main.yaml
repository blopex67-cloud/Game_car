              \tp.stream = streams[id]\n\tp.volume_db = float(defs[id].get(\"volume_db\", 0))\n\tp.max_distance = float(defs[id].get(\"max_distance\", 30))\n\tp.unit_size = 4.0\n\tp.pitch_scale = 1.0 + randf_range(-0.05,\
