              var right = _held("right") or Input.is_key_pressed(KEY_RIGHT) or Input.is_key_pressed(KEY_D)
              var gas = _held("gas") or Input.is_key_pressed(KEY_UP) or Input.is_key_pressed(KEY_W)
              var brake = _held("brake") or Input.is_key_pressed(KEY_DOWN) or Input.is_key_pressed(KEY_S)
              var hand = _held("hand") or Input.is_key_pressed(KEY_SPACE)
