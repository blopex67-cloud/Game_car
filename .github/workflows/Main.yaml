              \tvar lateral: Vector3 = global_transform.basis.x\n\tvar off: float = -0.12 if side == \"left\" else 0.12\n\treturn global_position + lateral * off\n\nfunc _find_skeleton(n: Node) -> Skeleton3D:\n\t\
