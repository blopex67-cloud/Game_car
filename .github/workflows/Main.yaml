            scripts/audio_manager.gd: "extends Node\n## Carga config/audio.yaml (vía data/audio.json) y reproduce cada evento de sonido.\n\nvar defs: Dictionary = {}\nvar streams: Dictionary = {}\nvar players_2d:\
              \ Dictionary = {}\n\nfunc _ready() -> void:\n\tvar f := FileAccess.open(\"res://data/audio.json\", FileAccess.READ)\n\tvar cfg: Dictionary = JSON.parse_string(f.get_as_text())\n\tdefs = cfg[\"sounds\"\
              ]\n\tfor id in defs:\n\t\tvar stream := load(\"res://\" + defs[id][\"file\"]) as AudioStreamWAV\n\t\tif stream == null:\n\t\t\tpush_warning(\"No se pudo cargar sonido: \" + id)\n\t\t\tcontinue\n\t\t\
              if defs[id].get(\"loop\", false):\n\t\t\tstream.loop_mode = AudioStreamWAV.LOOP_FORWARD\n\t\t\tstream.loop_end = stream.data.size() / 2\n\t\tstreams[id] = stream\n\nfunc _make_player(id: String) ->\
              \ AudioStreamPlayer:\n\tvar p := AudioStreamPlayer.new()\n\tp.stream = streams[id]\n\tp.volume_db = float(defs[id].get(\"volume_db\", 0))\n\tadd_child(p)\n\treturn p\n\nfunc play_once(id: String) ->\
              \ void:\n\tif not streams.has(id):\n\t\treturn\n\tvar p := _make_player(id)\n\tp.finished.connect(p.queue_free)\n\tp.play()\n\nfunc play_loop(id: String) -> void:\n\tif not streams.has(id) or players_2d.has(id):\n\
              \t\treturn\n\tvar p := _make_player(id)\n\tplayers_2d[id] = p\n\tp.play()\n\nfunc stop(id: String) -> void:\n\tif players_2d.has(id):\n\t\tplayers_2d[id].queue_free()\n\t\tplayers_2d.erase(id)\n\n##\
