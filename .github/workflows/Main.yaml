          AMYR_GAME_YAML_EOF

          mkdir -p "$(dirname tools/build_project.py)"
          cat > tools/build_project.py << 'AMYR_BUILD_PY_EOF'
          """Genera el proyecto Godot a partir de game.yaml (el único archivo fuente).
          - Escribe los scripts .gd, project.godot, escena y export_presets.cfg.
          - Escribe data/*.json con la configuración que leen los scripts.
          Uso: python tools/build_project.py"""
          import json, os, yaml

          ROOT = os.path.join(os.path.dirname(os.path.abspath(__file__)), "..")

          # Qué claves de game.yaml van a cada JSON que leen los scripts
          SPLIT = {
              "game.json": ["game", "graphics", "player", "camera", "game_over"],
              "amyr.json": ["model", "skeleton", "ik_legs", "ik_arms", "states", "vision"],
              "audio.json": ["bus", "sounds"],
              "test_scenario.json": ["scenario"],
          }

          with open(os.path.join(ROOT, "game.yaml"), encoding="utf-8") as f:
              doc = yaml.safe_load(f)

          os.makedirs(os.path.join(ROOT, "data"), exist_ok=True)
          for out, keys in SPLIT.items():
              data = {k: doc[k] for k in keys if k in doc}
              with open(os.path.join(ROOT, "data", out), "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print("data/" + out)

          for group in ("files", "scripts"):
              for rel, content in doc[group].items():
                  path = os.path.join(ROOT, rel)
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  with open(path, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content)
                  print(rel)
          AMYR_BUILD_PY_EOF

          mkdir -p "$(dirname tools/synth_audio.py)"
          cat > tools/synth_audio.py << 'AMYR_SYNTH_PY_EOF'
          """Genera los efectos de sonido del juego (WAV mono 22050 Hz, 16 bits).
          Todo es sintetizado: no requiere archivos externos ni licencias."""
          import wave, os
          import numpy as np

          SR = 22050
          OUT = os.path.join(os.path.dirname(os.path.abspath(__file__)), "..", "assets", "audio")
          rng = np.random.default_rng(7)

          def t(sec): return np.linspace(0, sec, int(SR * sec), endpoint=False)
          def lowpass(x, k=12): return np.convolve(x, np.ones(k) / k, mode="same")
          def env(n, attack=0.01, decay=5.0):
              tt = np.linspace(0, n / SR, n, endpoint=False)
              return np.clip(tt / attack, 0, 1) * np.exp(-decay * tt)
          def fm(freq, idx, sec, ratio=2.0):
              tt = t(sec)
              return np.sin(2 * np.pi * freq * tt + idx * np.sin(2 * np.pi * freq * ratio * tt))
          def norm(x, peak=0.9):
              return x / (np.max(np.abs(x)) or 1.0) * peak
          def loop_fade(x, ms=30):
              n = int(SR * ms / 1000); w = np.linspace(0, 1, n)
              x[:n] *= w; x[-n:] *= w[::-1]
              return x
          def save(name, x):
              x = np.clip(x, -1, 1)
              with wave.open(os.path.join(OUT, name + ".wav"), "wb") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(SR)
                  f.writeframes((x * 32767).astype(np.int16).tobytes())
              print(f"{name}.wav  {len(x)/SR:.2f}s")

          os.makedirs(OUT, exist_ok=True)

          for i in range(3):
              n = int(SR * 0.22)
              s = lowpass(rng.normal(0, 1, n), 18) * env(n, 0.005, 14 + i * 2)
              s += 0.25 * np.sin(2 * np.pi * (70 + 15 * i) * t(0.22)) * env(n, 0.003, 18)
              save(f"footstep_{i+1}", norm(s, 0.7))

          n = int(SR * 0.06)
          save("flashlight_click", norm(lowpass(rng.normal(0, 1, n), 3) * env(n, 0.001, 60), 0.6))

          d = t(2.0)
          hum = 0.4 * np.sin(2 * np.pi * 60 * d) + 0.2 * np.sin(2 * np.pi * 120 * d)
          hum += 0.15 * lowpass(rng.normal(0, 1, len(d)), 6)
          save("flashlight_hum_loop", loop_fade(norm(hum, 0.35)))

          d = t(10.0)
          drone = 0.5 * np.sin(2 * np.pi * 42 * d) + 0.3 * np.sin(2 * np.pi * 63.5 * d)
          wind = lowpass(rng.normal(0, 1, len(d)), 40) * (0.5 + 0.5 * np.sin(2 * np.pi * 0.12 * d))
          save("ambience_hallway_loop", loop_fade(norm(drone * 0.4 + wind * 0.6, 0.4), 200))

          hb = np.zeros(int(SR * 1.2))
          for start in (0.0, 0.28):
              k = int(SR * start); seg = int(SR * 0.16)
              hb[k:k+seg] += np.sin(2 * np.pi * 55 * t(0.16)) * env(seg, 0.01, 18)
          save("heartbeat_loop", loop_fade(norm(hb, 0.8), 10))

          n = int(SR * 2.4)
          br = lowpass(rng.normal(0, 1, n), 9) * np.sin(np.pi * np.linspace(0, 1, n)) ** 2
          save("breathing_scared", norm(br, 0.45))

          n = int(SR * 3.0)
          cr = fm(310, 9, 3.0, 3.1) * (0.5 + 0.5 * np.sin(2 * np.pi * 2.3 * t(3.0)))
          cr *= 0.2 + 0.8 * (rng.random(n) > 0.9992)
          save("amyr_servo_creak", norm(cr, 0.55))

          n = int(SR * 1.8)
          gr = fm(95, 6, 1.8, 1.5) + 0.4 * lowpass(rng.normal(0, 1, n), 14)
          gr *= np.clip(np.linspace(0, 1, n) * 4, 0, 1) * (1 - np.linspace(0, 1, n) * 0.6)
          save("amyr_growl", norm(gr, 0.85))

          n = int(SR * 1.2)
          sc = np.tanh(3.5 * fm(1450, 14, 1.2, 2.37)) * env(n, 0.02, 2.5)
          sc += 0.3 * lowpass(rng.normal(0, 1, n), 4) * env(n, 0.005, 4)
          save("amyr_attack_screech", norm(sc, 0.95))

          n = int(SR * 1.5)
          js = np.tanh(4 * fm(60, 3, 1.5)) * env(n, 0.003, 3.5) + 0.8 * lowpass(rng.normal(0, 1, n), 5) * env(n, 0.002, 6)
          save("jumpscare_stinger", norm(js, 1.0))

          n = int(SR * 1.0)
          bang = (np.sin(2 * np.pi * 180 * t(1.0)) + 0.5 * np.sin(2 * np.pi * 277 * t(1.0))) * env(n, 0.002, 7)
          save("distant_clang", norm(bang, 0.6))

          n = int(SR * 0.15)
          step = lowpass(rng.normal(0, 1, n), 10) * env(n, 0.002, 25) + 0.3 * np.sin(2 * np.pi * 400 * t(0.15)) * env(n, 0.001, 40)
          save("amyr_leg_step", norm(step, 0.5))
          AMYR_SYNTH_PY_EOF

      - name: Instalar Python y dependencias
        run: pip install pyyaml numpy

      - name: Generar sonidos y proyecto Godot
        run: |
          python tools/synth_audio.py
          python tools/build_project.py

      - name: Instalar Godot 4.3 y plantillas de exportación
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fL -o godot.zip "$BASE/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
          curl -fL -o templates.tpz "$BASE/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q -j templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable

      - name: Instalar Java y Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK (licencias aceptadas automáticamente)
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "GODOT_ANDROID_SDK_PATH=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "GODOT_JAVA_SDK_PATH=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Crear keystore de depuración
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Godot para exportar Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF_SETTINGS
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Importar recursos y exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./godot --headless --import
          set -o pipefail
          ./godot --headless --export-debug "Android" build/AmyrPasillo.apk 2>&1 | tee export.log

      - name: Diagnóstico legible si falla
        if: failure()
        run: |
          echo "=== LOG COMPLETO DE EXPORTACIÓN ==="
          if [ -f export.log ]; then cat export.log; else echo "No se generó export.log"; fi
          echo "=== Plantillas de exportación ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" || true
          echo "=== SDK de Android ==="
          ls "$HOME/android-sdk" || true
          ls "$HOME/android-sdk/build-tools" "$HOME/android-sdk/platforms" || true
          echo "=== Java ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "=== Configuración del editor ==="
          cat "$HOME/.config/godot/editor_settings-4.tres" || true
          echo "=== Keystore ==="
          ls -la "$HOME/debug.keystore" || true

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AmyrPasillo-APK
          path: build/AmyrPasillo.apk
