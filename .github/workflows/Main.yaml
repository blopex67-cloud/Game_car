                  var hit = false
                  for k in keys:
                      if nm.contains(k):
                          hit = true
                  if not hit:
                      continue
                  var has_body = mi.get_parent() is StaticBody3D
                  for c in mi.get_children():
                      if c is StaticBody3D:
                          has_body = true
                  if not has_body:
                      mi.create_trimesh_collision()


