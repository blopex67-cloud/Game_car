              ])) * delta, 0, float(cfg[\"stamina\"][\"max\"]))\n\tsound_radius = 5.0 if running else (1.0 if input.length() > 0.1 else 0.0)\n\n\t# Batería de la linterna\n\tif flashlight_on:\n\t\tbattery -= delta\n\
              \t\tif battery <= 0.0:\n\t\t\tbattery = 0.0\n\t\t\tflashlight_on = false\n\t\t\tflashlight.visible = false\n\tvar low := battery < 15.0 and flashlight_on\n\tflashlight.light_energy = float(cfg[\"flashlight\"\
              ][\"intensity\"]) * (randf_range(0.3, 1.0) if low else 1.0)\n\n\t# Balanceo de cabeza y pasos\n\tvar moving := input.length() > 0.1 and is_on_floor()\n\tif moving:\n\t\tbob_t += delta * (9.0 if running\
